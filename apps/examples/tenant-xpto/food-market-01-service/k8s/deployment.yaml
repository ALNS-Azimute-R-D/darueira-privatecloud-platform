apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-market-01-service
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: food-market-01-service
    app.kubernetes.io/part-of: swfabrik-europe-marketplaces
    darueira.io/tier: tenant-workload
    darueira.io/tenant: swfabrik-europe
    darueira.io/project: marketplaces
    darueira.io/env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: food-market-01-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: food-market-01-service
        app.kubernetes.io/part-of: swfabrik-europe-marketplaces
        darueira.io/tier: tenant-workload
        darueira.io/tenant: swfabrik-europe
        darueira.io/project: marketplaces
        darueira.io/env: dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: localhost:8082/swfabrik-europe/food-market-01-service:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://tenant-postgres.drr-tnt-swfabrik-europe-dev.svc.cluster.local:5432/drr_tnt_bizapps_db?currentSchema=schm01"
            - name: SPRING_DATASOURCE_USERNAME
              value: "drr_tnt_svcs_admin"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "tenant_pg_secure_pass_2026"
            - name: SPRING_RABBITMQ_HOST
              value: "message-broker-rabbitmq.drr-corpshared-plat.svc.cluster.local"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: "drr_admin"
            - name: SPRING_RABBITMQ_PASSWORD
              value: "darueira-admin123"
            - name: SPRING_RABBITMQ_VHOST
              value: "/"
            - name: APP_MARKET_ID
              value: "MKT-EU-01-SPRING"
            - name: APP_RABBITMQ_TOPIC
              value: "marketplace.foodtrading.topic"
            - name: APP_RABBITMQ_QUEUE
              value: "marketplace.foodtrading.queue01"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          # Liveness must not depend on PostgreSQL or RabbitMQ: when a dependency is down the pod
          # should leave the Service (readiness), not be restarted (liveness).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: food-market-01-service
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: food-market-01-service
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: food-market-01-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
