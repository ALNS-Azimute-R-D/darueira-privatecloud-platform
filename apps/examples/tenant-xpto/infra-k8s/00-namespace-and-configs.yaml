apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-sidecar-config
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    darueira.io/tier: tenant-workload
    darueira.io/component: envoy-pep
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: ingress_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: app_service
              http_filters:
              - name: envoy.filters.http.ext_authz
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                  grpc_service:
                    envoy_grpc:
                      cluster_name: opa_ext_authz_grpc
                    timeout: 0.25s
                  transport_api_version: V3
                  failure_mode_allow: false
                  status_on_error:
                    code: 503
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: app_service
        connect_timeout: 0.50s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: app_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8080
      - name: opa_ext_authz_grpc
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        http2_protocol_options: {}
        load_assignment:
          cluster_name: opa_ext_authz_grpc
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 9191
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy-config
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    darueira.io/tier: tenant-workload
    darueira.io/component: opa-pdp
data:
  envoy_authz.rego: |
    package envoy.authz
    import future.keywords.in
    import future.keywords.if
    default allow := false
    public_paths := ["/healthz", "/readyz", "/livez", "/metrics", "/swagger-ui", "/v3/api-docs", "/docs", "/openapi.json", "/api/food-tradings", "/api/food01", "/api/food02", "/api/food03", "/api/food04", "/api/food05", "/api/food06"]
    path_is_public if { some path in public_paths; startswith(input.attributes.request.http.path, path) }
    allow if { path_is_public }
    allow if { startswith(object.get(input.attributes.source, "principal", ""), "spiffe://darueira.local/") }
    user_id := uid if { uid := input.attributes.request.http.headers["x-user-id"]; uid != "" } else := "anonymous"
    allow if { user_id in ["admin", "admin-root", "system:admin"] }
