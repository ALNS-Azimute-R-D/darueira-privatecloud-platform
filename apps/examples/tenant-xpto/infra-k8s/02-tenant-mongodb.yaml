apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenant-mongodb-pvc
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-mongodb
    darueira.io/tier: tenant-workload
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tenant-mongodb
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-mongodb
    app.kubernetes.io/component: document-database
    darueira.io/tier: tenant-workload
spec:
  serviceName: tenant-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-mongodb
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tenant-mongo-credentials
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-mongo-credentials
                  key: password
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: tenant-mongo-credentials
                  key: database
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --port 27017 --eval \"db.adminCommand('ping')\""
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --port 27017 --eval \"db.adminCommand('ping')\""
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: tenant-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-mongodb
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-mongodb
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-mongodb
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
