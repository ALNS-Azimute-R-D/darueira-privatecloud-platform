apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-openbao-config
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-openbao
    darueira.io/tier: tenant-workload
data:
  vault.json: |
    {
      "listener": {
        "tcp": {
          "address": "0.0.0.0:8200",
          "tls_disable": true
        }
      },
      "storage": {
        "file": {
          "path": "/vault/data"
        }
      },
      "ui": true,
      "default_lease_ttl": "168h",
      "max_lease_ttl": "720h",
      "disable_mlock": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-openbao
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-openbao
    app.kubernetes.io/component: secrets-management
    darueira.io/tier: tenant-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-openbao
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: openbao/openbao:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["bao", "server", "-dev", "-dev-root-token-id=tenant-vault-root-token-2026", "-dev-listen-address=0.0.0.0:8200"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-openbao
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-openbao
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-openbao
  ports:
    - port: 8200
      targetPort: 8200
      name: http
