apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alns-voize-ehr-integrator.name" . }}
  labels:
    {{- include "alns-voize-ehr-integrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alns-voize-ehr-integrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alns-voize-ehr-integrator.labels" . | nindent 8 }}
        darueira.io/egress-internet: "true"   # lets the network policy reach the public Vivendi demo
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          env:
            - name: SERVER_HOST
              value: {{ .Values.app.host | quote }}
            - name: SERVER_PORT
              value: {{ .Values.app.port | quote }}
            - name: SERVICE_DOCS_ENABLED
              value: {{ .Values.app.docsEnabled | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: VIVENDI_DEFAULT_AREA_ID
              value: {{ .Values.app.defaultAreaId | quote }}
            - name: VIVENDI_PROFILE
              value: {{ .Values.app.profile | quote }}
            - name: VIVENDI_SESSION_STORE
              value: {{ .Values.sessionStore.kind | quote }}
            {{- if eq .Values.sessionStore.kind "postgres" }}
            - name: VIVENDI_SESSION_LOCK_WAIT
              value: {{ .Values.sessionStore.lockWait | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sessionStore.databaseSecret }}
                  key: url
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sessionStore.databaseSecret }}
                  key: user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sessionStore.databaseSecret }}
                  key: password
            - name: DATABASE_SCHEMA
              value: {{ .Values.sessionStore.schema | quote }}
            - name: DATABASE_POOL_MAX
              value: {{ .Values.sessionStore.poolMax | quote }}
            - name: DATABASE_TIMEOUT
              value: {{ .Values.sessionStore.timeout | quote }}
            - name: SESSION_STORE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sessionStore.keySecret }}
                  key: session-store-key
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
