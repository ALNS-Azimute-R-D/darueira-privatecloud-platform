apiVersion: v1
kind: Service
metadata:
  name: {{ include "alns-voize-ehr-integrator.name" . }}
  labels:
    {{- include "alns-voize-ehr-integrator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.app.port }}
      protocol: TCP
  selector:
    {{- include "alns-voize-ehr-integrator.selectorLabels" . | nindent 4 }}
