# Defaults. Environment-specific values live in values-<env>.yaml (the ArgoCD Application lists both).
# The image `tag:` is rewritten by the Tekton task `task-gitops-helm-promote` in values-dev-green.yaml.
tenant: swfabrik-europe
project: ehr-integrations
env: dev

replicaCount: 2           # the session is shared through PostgreSQL (voize spec 006), so more than one replica is safe

image:
  repository: nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/swfabrik-europe/alns-voize-ehr-integrator
  tag: "0.0.0-bootstrap"
  pullPolicy: Always

# Application configuration (environment variables of the service; see README of the app).
app:
  port: 8080
  host: "0.0.0.0"          # inside the container; the service itself defaults to 127.0.0.1
  profile: demo            # `demo` calls the public Vivendi SISWeb demo, `local` expects a WireMock
  defaultAreaId: "94"
  docsEnabled: "true"

# Where the Vivendi session lives (voize spec 006, ADR 0018): `postgres` shares it between replicas and keeps it across
# restarts; `file` keeps it in the container (lost on restart, one replica only); `none` never stores it.
# The Secrets are created by scripts/provision_voize_session_db.sh and hold the only credentials (never in values).
sessionStore:
  kind: postgres
  lockWait: 10s
  databaseSecret: alns-voize-ehr-integrator-db      # keys: url, user, password
  keySecret: alns-voize-ehr-integrator-session      # key: session-store-key (base64, 32 bytes)
  schema: public
  poolMax: "3"
  timeout: 2s

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod Security "restricted": non-root, no privilege escalation, no capabilities.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

probes:
  path: /healthz
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5

# Extra egress for this app only (see templates/networkpolicy.yaml). 4482 = Vivendi SISWeb demo.
networkPolicy:
  enabled: true
  egressPorts:
    - "4482"

# Single-node cluster: pin to the node, as the previous chart did.
nodeSelector:
  kubernetes.io/hostname: nbalns-mifcom-lnx-01
