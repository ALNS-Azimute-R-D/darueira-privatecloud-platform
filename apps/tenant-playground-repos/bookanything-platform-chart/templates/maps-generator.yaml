{{- $g := .Values.mapsGenerator }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $g.name }}
  labels:
    app.kubernetes.io/name: {{ $g.name }}
    app.kubernetes.io/component: maps-generator
    {{- include "bookanything.labels" (dict "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $g.name }}
      darueira.io/tenant: {{ .Values.tenant }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $g.name }}
        app.kubernetes.io/component: maps-generator
        {{- include "bookanything.labels" (dict "root" .) | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: maps-generator
          image: "{{ .Values.registry }}/{{ $g.image.repository }}:{{ $g.image.tag }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ $g.port }}}
          env:
            - {name: SERVER_PORT, value: {{ $g.port | quote }}}
            - {name: TEMPORAL_HOST_PORT, value: {{ .Values.temporal.address | quote }}}
            - {name: TEMPORAL_NAMESPACE, value: {{ .Values.temporal.namespace | quote }}}
            - {name: TEMPORAL_TASK_QUEUE, value: {{ $g.taskQueue | quote }}}
            - {name: TEMPORAL_WORKER_ENABLED, value: {{ $g.workerEnabled | quote }}}
            - {name: MINIO_ENDPOINT, value: {{ .Values.minio.url | quote }}}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: bookanything-credentials, key: minio_access_key}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: bookanything-credentials, key: minio_secret_key}}}
            - {name: MINIO_BUCKET_IMAGES, value: {{ .Values.minio.bucketImages | quote }}}
          livenessProbe:
            httpGet: {path: /healthz, port: {{ $g.port }}}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: {{ $g.port }}}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $g.name }}
  labels:
    app.kubernetes.io/name: {{ $g.name }}
    {{- include "bookanything.labels" (dict "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - {name: http, port: {{ $g.port }}, targetPort: {{ $g.port }}}
  selector:
    app.kubernetes.io/name: {{ $g.name }}
    darueira.io/tenant: {{ .Values.tenant }}
