micronaut:
  application:
    name: caseforce-legalhub-mgmt
  server:
    port: 8080
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: "${JWT_SECRET:pleaseChangeThisSecretForAMoreSecureOne}"
              jws-algorithm: HS256
    intercept-url-map:
      - pattern: /swagger/**
        access: isAnonymous()
      - pattern: /swagger-ui/**
        access: isAnonymous()
      - pattern: /login
        access: isAnonymous()
      - pattern: /login-new
        access: isAnonymous()

logger:
  levels:
    root: ${LOG_LEVEL:INFO}
    de.legalhub: DEBUG
    io.micronaut: INFO
    io.micronaut.security: DEBUG
    io.micronaut.http.server: DEBUG
    io.micronaut.http.client: DEBUG

datasources:
  default:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:caseforce}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    dialect: POSTGRES
    driver-class-name: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:databasemigrations

rabbitmq:
  enabled: ${RABBITMQ_ENABLED:true}
  uri: amqp://${RABBITMQ_USER:guest}:${RABBITMQ_PASSWORD:guest}@${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5673}

webhook:
  retry:
    max-attempts: ${WEBHOOK_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${WEBHOOK_RETRY_INITIAL_BACKOFF_MS:1000}
    multiplier: ${WEBHOOK_RETRY_MULTIPLIER:2.0}
    job:
      enabled: ${WEBHOOK_RETRY_JOB_ENABLED:true}
      fixed-delay: ${WEBHOOK_RETRY_JOB_FIXED_DELAY:5m}
      initial-delay: ${WEBHOOK_RETRY_JOB_INITIAL_DELAY:1m}
      max-attempts: ${WEBHOOK_RETRY_JOB_MAX_ATTEMPTS:10}
