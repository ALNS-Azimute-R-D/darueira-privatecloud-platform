# Local development only (workspace; it is not published to Forgejo). Since ADR-0018 the platform uses PostgreSQL.
# The application defaults match this file: DB_HOST=localhost, DB_PORT=5432, DB_NAME=caseforce, DB_USER/DB_PASSWORD=postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caseforce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.8-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"

volumes:
  postgres-data:
