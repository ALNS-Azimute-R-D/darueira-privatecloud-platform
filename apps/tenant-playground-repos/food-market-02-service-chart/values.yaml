# Defaults. The image `tag:` is rewritten in values-dev-green.yaml by the Tekton task
# `task-gitops-helm-promote`; credentials come from secrets, never from this file.
name: food-market-02-service
tenant: swfabrik-europe
env_name: dev
replicaCount: 1
runAsUser: 1001
image:
  repository: nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/swfabrik-europe/food-market-02-service
  tag: 0.0.0-bootstrap
  pullPolicy: IfNotPresent
containerPort: 8082
service:
  port: 8082
useDatabase: true
env:
- name: QUARKUS_HTTP_PORT
  value: '8082'
- name: QUARKUS_DATASOURCE_JDBC_URL
  value: jdbc:postgresql://tenant-postgres.drr-tnt-swfabrik-europe-dev.svc.cluster.local:5432/drr_tnt_bizapps_db?currentSchema=schm02
- name: QUARKUS_DATASOURCE_USERNAME
  value: $(DB_USER)
- name: QUARKUS_DATASOURCE_PASSWORD
  value: $(DB_PASSWORD)
- name: RABBITMQ_HOST
  value: message-broker-rabbitmq.drr-corpshared-plat.svc.cluster.local
- name: RABBITMQ_PORT
  value: '5672'
- name: RABBITMQ_USERNAME
  value: $(MQ_USER)
- name: RABBITMQ_PASSWORD
  value: $(MQ_PASSWORD)
- name: RABBITMQ_VHOST
  value: /
- name: APP_MARKET_ID
  value: MKT-EU-02-QUARKUS
- name: APP_RABBITMQ_TOPIC
  value: marketplace.foodtrading.topic
- name: APP_RABBITMQ_QUEUE
  value: marketplace.foodtrading.queue02
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8082
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8082
  initialDelaySeconds: 10
  periodSeconds: 5
nodeSelector:
  kubernetes.io/hostname: nbalns-mifcom-lnx-01
