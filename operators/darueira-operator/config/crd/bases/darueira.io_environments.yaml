apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environments.darueira.io
spec:
  group: darueira.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
    shortNames:
      - env
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantRef
                - projectRef
                - type
              properties:
                tenantRef:
                  type: string
                projectRef:
                  type: string
                type:
                  type: string
                  enum:
                    - dev
                    - staging
                    - prod
                deployers:
                  type: array
                  items:
                    type: string
                operators:
                  type: array
                  items:
                    type: string
                enableSidecarPEP:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                namespaceName:
                  type: string
                ciliumPolicyApplied:
                  type: boolean
                openFGATuplesSynced:
                  type: boolean
                ready:
                  type: boolean
      subresources:
        status: {}
