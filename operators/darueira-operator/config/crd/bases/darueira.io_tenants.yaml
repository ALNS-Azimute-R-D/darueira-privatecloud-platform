apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.darueira.io
spec:
  group: darueira.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
    shortNames:
      - tnt
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - displayName
                - adminEmail
              properties:
                displayName:
                  type: string
                adminEmail:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                resourceQuota:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    storage:
                      type: string
                    maxPods:
                      type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                activeProjectsCount:
                  type: integer
                openFGATuplesSynced:
                  type: boolean
      subresources:
        status: {}
