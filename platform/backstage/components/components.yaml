apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: drr-iam-authz-svc
  title: "IAM Authorization Service (ReBAC)"
  description: "Relationship-Based Access Control authorization engine powered by OpenFGA and OIDC JWT validation"
  annotations:
    backstage.io/techdocs-ref: dir:.
    prometheus.io/rule: "sum(rate(http_requests_total{service='drr-iam-authz-svc'}[5m]))"
    grafana/dashboard-selector: "drr-iam-authz"
spec:
  type: service
  lifecycle: production
  owner: group:platform-secops-team
  system: darueira-control-plane
  providesApis:
    - openapi-iam-authz
  consumesApis:
    - openapi-keycloak
    - openapi-openfga
