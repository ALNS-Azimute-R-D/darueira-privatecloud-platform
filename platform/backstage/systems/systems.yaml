apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: darueira-control-plane
  title: "Darueira Control Plane System"
  description: "Core administrative and orchestration services managing tenants, environments, projects, and permissions"
spec:
  owner: group:platform-core-team
  domain: darueira-platform-domain
