# ==============================================================================
# DARUEIRA PRIVATE CLOUD PLATFORM - BACKSTAGE UNIFIED SOFTWARE CATALOG
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DOMAIN: Darueira Private Cloud Platform
# ------------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: darueira-cloud
  title: Darueira Private Cloud Platform
  description: Multi-tenant, air-gapped enterprise cloud platform running on Kubernetes with zero-trust security and GitOps.
spec:
  owner: group:platform-core-team
---
# ------------------------------------------------------------------------------
# 2. SYSTEMS
# ------------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: darueira-plat
  title: Corporate Platform Services
  description: Central identity, relational & document persistence, messaging brokers, and ingress gateway.
spec:
  owner: group:platform-core-team
  domain: darueira-cloud
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: darueira-secr
  title: Corporate Security & PKI
  description: Enterprise secret management (OpenBao) and local X.509 Certificate Authority (Step-CA).
spec:
  owner: group:security-team
  domain: darueira-cloud
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: darueira-obs
  title: Corporate Observability & Telemetry
  description: OpenTelemetry Collector, Prometheus, Grafana, OpenSearch logs, and Jaeger APM tracing.
spec:
  owner: group:sre-team
  domain: darueira-cloud
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: darueira-mgmt
  title: Corporate Management & CI/CD
  description: ArgoCD GitOps engine, Tekton Pipelines, Internal Developer Portal (Backstage), and Environment Orchestrator.
spec:
  owner: group:devops-team
  domain: darueira-cloud
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: tenant-acme
  title: Tenant ACME Corp Services
  description: Isolated tenant plane hosting ACME workloads, dedicated databases, and tenant IAM.
spec:
  owner: group:acme-tenant-team
  domain: darueira-cloud
---
