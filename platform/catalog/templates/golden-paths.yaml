apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: tenant-provisioning-template
  title: Provision New Platform Tenant
  description: Automated Golden Path to provision a complete isolated tenant environment (Namespace, PostgreSQL DBs, Schemas, OpenBao Secrets, Keycloak Realm, NetworkPolicies).
  tags: [platform, tenant, automation, multi-tenancy]
spec:
  owner: group:platform-core-team
  type: environment
  parameters:
    - title: Tenant Identification
      required:
        - tenant_id
        - tenant_name
      properties:
        tenant_id:
          title: Tenant Identifier
          type: string
          description: Lowercase alphanumeric identifier (e.g. globex, initech, wayne)
        tenant_name:
          title: Tenant Display Name
          type: string
          description: Full company name (e.g. Globex Corporation)
  steps:
    - id: log-scaffolding
      name: Provisioning Tenant Plane
      action: debug:log
      input:
        message: "Provisioning tenant environment for: ${{ parameters.tenant_name }} (${{ parameters.tenant_id }})"
  output:
    links:
      - title: ArgoCD Applications
        url: https://argocd.darueira-corpshared.127.0.0.1.nip.io
