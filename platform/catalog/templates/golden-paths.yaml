apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spring-boot-kotlin-service
  title: Spring Boot 3 + Kotlin Microservice
  description: Scaffolds an enterprise Spring Boot microservice with Kotlin, Gradle, OpenFGA ReBAC SDK, Tekton CI/CD pipeline, and ArgoCD GitOps deployment.
  tags: [recommended, spring-boot, kotlin, java, backend, openfga]
spec:
  owner: group:platform-core-team
  type: service
  parameters:
    - title: Service Configuration
      required:
        - component_id
        - description
        - owner
      properties:
        component_id:
          title: Service Name
          type: string
          description: Unique name for the service (e.g. payment-service, order-processor)
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Brief summary of the service's purpose
        owner:
          title: Owner
          type: string
          description: Team responsible for maintaining this component
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
    - title: Architecture & Infrastructure Options
      properties:
        database:
          title: Relational Database
          type: string
          description: Target PostgreSQL database for persistence
          enum:
            - "Central PostgreSQL (Shared Platform)"
            - "Tenant Dedicated PostgreSQL (ACME Corp)"
            - "None"
          default: "Tenant Dedicated PostgreSQL (ACME Corp)"
        messaging:
          title: Message Broker Integration
          type: string
          description: Event messaging broker integration
          enum:
            - "Kafka / Redpanda"
            - "RabbitMQ"
            - "None"
          default: "Kafka / Redpanda"
  steps:
    - id: log-scaffolding
      name: Scaffolding Service
      action: debug:log
      input:
        message: "Scaffolding Spring Boot Kotlin microservice: ${{ parameters.component_id }}"
  output:
    links:
      - title: Repository
        url: https://git.darueira-corpshared.127.0.0.1.nip.io
---
