apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-workloads-appset
  namespace: drr-corpshared-mgmt
  labels:
    darueira.io/tier: tenant-workload
spec:
  generators:
    # NOTE (2026-09-23): the 6 demo/scaffold elements this generator used to
    # carry (darueira-corp/platform-core/prod, acme/storefront/{dev,staging,
    # prod}, globex/logistics/{dev,prod}) were removed — those tenants were
    # never meant to exist on this cluster. Their namespaces and generated
    # Applications were deleted directly (kubectl) and, since this
    # ApplicationSet has selfHeal:true, emptying this list is what stops
    # ArgoCD from recreating them. Real tenants (swfabrik-latam,
    # swfabrik-europe) are onboarded via their own dedicated
    # `<tenant>-tenant-infra` Application, not through this generator.
    - list:
        elements: []
  template:
    metadata:
      name: "tenant-{{tenant}}-{{project}}-{{env}}"
      labels:
        darueira.io/tenant: "{{tenant}}"
        darueira.io/project: "{{project}}"
        darueira.io/environment: "{{env}}"
        darueira.io/tier: "tenant-workload"
    spec:
      project: darueira-tenants
      source:
        repoURL: "http://forgejo-git.drr-corpshared-plat.svc.cluster.local:3000/darueira-corp/platform-core.git"
        targetRevision: main
        path: "platform/kustomize/base/tnt-tenant-base"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "drr-tnt-{{tenant}}-{{project}}-{{env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
