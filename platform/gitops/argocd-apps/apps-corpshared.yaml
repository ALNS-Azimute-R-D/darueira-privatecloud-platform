apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: corpshared-secr-internal
  namespace: drr-corpshared-mgmt
  labels:
    darueira.io/tier: enterprise-shared
spec:
  project: darueira-enterprise-shared
  source:
    repoURL: "http://forgejo-git.drr-corpshared-plat.svc.cluster.local:3000/darueira-corp/platform-core.git"
    targetRevision: main
    path: "platform/kustomize/base/corpshared-secr-internal"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "drr-corpshared-secr-internal"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
