apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: standard-ci-cd-pipeline
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-cd-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Standard end-to-end continuous integration & continuous deployment pipeline: Forgejo Git Clone -> Build/Test -> Security Scan -> Kaniko Image Build & Push to Nexus Registry -> ArgoCD GitOps Sync"
  params:
    - name: git-url
      type: string
      default: "http://forgejo-git.drr-corpshared-plat.svc.cluster.local:3000/darueira-corp/platform-core.git"
      description: "Git repository repository URL"
    - name: git-revision
      type: string
      default: "main"
      description: "Git revision, branch or commit SHA"
    - name: runtime
      type: string
      default: "golang"
      description: "Polyglot runtime type (golang, gradle, maven, node)"
    - name: source-subpath
      type: string
      default: "."
      description: "Application directory within repository"
    - name: image-name
      type: string
      default: "nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/darueira/sample-app:latest"
      description: "Target container image destination (Nexus OCI registry)"
    - name: dockerfile-path
      type: string
      default: "Dockerfile"
      description: "Relative path to Dockerfile"
    - name: argocd-app-name
      type: string
      default: "corpshared-plat"
      description: "Name of the target ArgoCD application to synchronize after build"
  workspaces:
    - name: pipeline-workspace
      description: "Shared workspace for cloned code and build artifacts"
  tasks:
    - name: clone-source
      taskRef:
        name: task-git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: pipeline-workspace

    - name: test-and-build
      taskRef:
        name: task-polyglot-build
      runAfter:
        - clone-source
      params:
        - name: runtime
          value: $(params.runtime)
        - name: source-subpath
          value: $(params.source-subpath)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: security-audit
      taskRef:
        name: task-security-scan
      runAfter:
        - test-and-build
      params:
        - name: source-subpath
          value: $(params.source-subpath)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: build-and-publish-image
      taskRef:
        name: task-kaniko-build
      runAfter:
        - security-audit
      params:
        - name: image-name
          value: $(params.image-name)
        - name: dockerfile-path
          value: $(params.dockerfile-path)
        - name: context-subpath
          value: $(params.source-subpath)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: sync-argocd-deployment
      taskRef:
        name: task-argocd-sync
      runAfter:
        - build-and-publish-image
      params:
        - name: application-name
          value: $(params.argocd-app-name)
