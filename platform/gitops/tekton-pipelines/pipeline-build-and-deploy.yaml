apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: standard-ci-cd-pipeline
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-cd-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Standard end-to-end continuous integration & continuous deployment pipeline: Forgejo Git Clone -> Build/Test -> Security Scan -> Kaniko Image Build & Push to Nexus Registry -> ArgoCD GitOps Sync"
  params:
    - name: git-url
      type: string
      default: "http://forgejo-git.drr-corpshared-plat.svc.cluster.local:3000/darueira-corp/platform-core.git"
      description: "Git repository repository URL"
    - name: git-revision
      type: string
      default: "main"
      description: "Git revision, branch or commit SHA"
    - name: runtime
      type: string
      default: "auto"
      description: "Polyglot runtime type (auto, node, golang, maven, gradle, python, dotnet)"
    - name: source-subpath
      type: string
      default: "."
      description: "Application directory within repository"
    - name: image-name
      type: string
      default: "nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/darueira/sample-app:latest"
      description: "Target container image destination (Nexus OCI registry)"
    - name: image-tag
      type: string
      default: "auto"
      description: "Container image tag version (default 'auto' uses YYYY.MMDD.HHMMSS in CET/CEST timezone)"
    - name: dockerfile-path
      type: string
      default: "Dockerfile"
      description: "Relative path to Dockerfile"
    - name: argocd-app-name
      type: string
      default: "corpshared-plat"
      description: "Name of the target ArgoCD application to synchronize after build"
    - name: tenant-name
      type: string
      default: "swfabrik-europe"
      description: "Tenant organization name in Forgejo"
    - name: app-name
      type: string
      default: "sample-app"
      description: "Application repository name"
    - name: target-env
      type: string
      default: "dev-green"
      description: "Target environment values file to update"
  results:
    - name: image-tag
      description: "Concrete version tag assigned to the container image"
      value: $(tasks.build-and-publish-image.results.image-tag)
    - name: image-url
      description: "Full versioned image reference published to the registry"
      value: $(tasks.build-and-publish-image.results.image-url)
  workspaces:
    - name: pipeline-workspace
      description: "Shared workspace for cloned code and build artifacts"
  tasks:
    - name: clone-source
      taskRef:
        name: task-git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: pipeline-workspace

    - name: test-and-build
      taskRef:
        name: task-polyglot-build
      runAfter:
        - clone-source
      params:
        - name: runtime
          value: $(params.runtime)
        - name: source-subpath
          value: $(params.source-subpath)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: security-audit
      taskRef:
        name: task-security-scan
      runAfter:
        - test-and-build
      params:
        - name: source-subpath
          value: $(params.source-subpath)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: build-and-publish-image
      taskRef:
        name: task-kaniko-build
      runAfter:
        - security-audit
      params:
        - name: image-name
          value: $(params.image-name)
        - name: image-tag
          value: $(params.image-tag)
        - name: dockerfile-path
          value: $(params.dockerfile-path)
        - name: context-subpath
          value: $(params.source-subpath)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: promote-to-helm-gitops
      taskRef:
        name: task-gitops-helm-promote
      runAfter:
        - build-and-publish-image
      params:
        - name: tenant-name
          value: $(params.tenant-name)
        - name: app-name
          value: $(params.app-name)
        - name: target-env
          value: $(params.target-env)
        - name: values-file
          value: "values-$(params.target-env).yaml"
        - name: image-tag
          value: $(tasks.build-and-publish-image.results.image-tag)

    - name: sync-argocd-deployment
      taskRef:
        name: task-argocd-sync
      runAfter:
        - promote-to-helm-gitops
      params:
        - name: application-name
          value: $(params.argocd-app-name)
