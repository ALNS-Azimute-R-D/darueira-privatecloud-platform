# Maven local repository shared by the CI runs (mounted by task-polyglot-build as a volume, not as a workspace).
# microk8s-hostpath binds when the first run mounts it. Deleting the claim only costs a cold first build.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maven-repo-cache
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 5Gi
