# Maven local repository shared by the CI runs (mounted by task-polyglot-build as a volume, not as a workspace).
# Bound to pv-drr-maven-repo-cache (data/corpshared-mgmt/maven-repo-cache). Deleting the claim only costs a cold first build.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maven-repo-cache
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  volumeName: pv-drr-maven-repo-cache
  resources:
    requests:
      storage: 5Gi
