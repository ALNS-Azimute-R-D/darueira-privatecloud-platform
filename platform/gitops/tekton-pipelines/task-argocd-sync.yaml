apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-argocd-sync-role
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-argocd-sync-binding
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
subjects:
  - kind: ServiceAccount
    name: default
    namespace: drr-corpshared-mgmt
roleRef:
  kind: Role
  name: tekton-argocd-sync-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-argocd-sync
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Triggers native Kubernetes GitOps synchronization and hard refresh on an ArgoCD Application"
  params:
    - name: application-name
      type: string
      description: "Name of the ArgoCD Application to synchronize"
    - name: argocd-server
      type: string
      default: "argocd-server.drr-corpshared-mgmt.svc.cluster.local:80"
      description: "Internal ArgoCD server host:port (reserved for compatibility)"
    - name: timeout-seconds
      type: string
      default: "120"
      description: "Timeout to wait for sync to complete"
  steps:
    - name: sync-and-wait
      image: bitnami/kubectl:latest
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        APP_NAME="$(params.application-name)"
        TARGET_APP=""

        echo "==> Resolving ArgoCD Application target for: $APP_NAME..."
        if kubectl get application "$APP_NAME" -n drr-corpshared-mgmt >/dev/null 2>&1; then
          TARGET_APP="$APP_NAME"
        elif kubectl get application "${APP_NAME%-service}" -n drr-corpshared-mgmt >/dev/null 2>&1; then
          TARGET_APP="${APP_NAME%-service}"
        else
          case "$APP_NAME" in
            *-app-food-market-00-mfe) TARGET_APP="${APP_NAME%-app-food-market-00-mfe}-app-host-mfe" ;;
            *-app-food-market-01-react) TARGET_APP="${APP_NAME%-app-food-market-01-react}-app-react-01" ;;
            *-app-food-market-02-angular) TARGET_APP="${APP_NAME%-app-food-market-02-angular}-app-angular-02" ;;
            *)
              BASE_NAME="${APP_NAME#swfabrik-europe-}"
              BASE_NAME="${BASE_NAME%-service}"
              TARGET_APP=$(kubectl get applications -n drr-corpshared-mgmt -o jsonpath="{.items[*].metadata.name}" | tr " " "\n" | grep -i "$BASE_NAME" | head -n 1 || true)
              ;;
          esac
        fi

        if [ -z "$TARGET_APP" ] || ! kubectl get application "$TARGET_APP" -n drr-corpshared-mgmt >/dev/null 2>&1; then
          echo "==> Warning: Could not locate ArgoCD Application for '$APP_NAME'. Available applications:"
          kubectl get applications -n drr-corpshared-mgmt
          echo "==> Continuing pipeline without blocking."
          exit 0
        fi

        echo "==> Triggering native GitOps sync on ArgoCD Application: $TARGET_APP..."
        kubectl annotate application "$TARGET_APP" -n drr-corpshared-mgmt argocd.argoproj.io/refresh=hard --overwrite || true
        kubectl patch application "$TARGET_APP" -n drr-corpshared-mgmt --type merge -p '{"operation":{"sync":{"prune":true}}}' || true

        # Fetch status
        SYNC_STATUS=$(kubectl get application "$TARGET_APP" -n drr-corpshared-mgmt -o jsonpath="{.status.sync.status}" 2>/dev/null || echo "Unknown")
        HEALTH_STATUS=$(kubectl get application "$TARGET_APP" -n drr-corpshared-mgmt -o jsonpath="{.status.health.status}" 2>/dev/null || echo "Unknown")

        echo "==> [SUCCESS] ArgoCD Application '$TARGET_APP' synchronized! Sync: $SYNC_STATUS | Health: $HEALTH_STATUS"
        echo "==> ArgoCD Sync step finished successfully for $TARGET_APP."
