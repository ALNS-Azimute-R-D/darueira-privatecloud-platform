apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-git-clone
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Clones a source Git repository into a shared workspace"
  params:
    - name: url
      type: string
      description: "Git repository clone URL"
    - name: revision
      type: string
      default: "main"
      description: "Git branch, tag, or commit SHA to checkout"
    - name: depth
      type: string
      default: "1"
      description: "Perform shallow clone"
  workspaces:
    - name: output
      description: "Workspace where repository source is cloned"
  steps:
    - name: clone
      image: alpine/git:2.45.2
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "==> Cloning $(params.url) at revision $(params.revision) (depth: $(params.depth))..."
        git clone --depth "$(params.depth)" --branch "$(params.revision)" "$(params.url)" $(workspaces.output.path)/source || \
        git clone --depth "$(params.depth)" "$(params.url)" $(workspaces.output.path)/source
        cd $(workspaces.output.path)/source
        git checkout "$(params.revision)" || true
        echo "==> Successfully cloned repository. Commit SHA: $(git rev-parse HEAD)"
