apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-git-clone
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Clones a source Git repository into a shared workspace"
  params:
    - name: url
      type: string
      description: "Git repository clone URL"
    - name: revision
      type: string
      default: "main"
      description: "Git branch, tag, or commit SHA to checkout"
    - name: depth
      type: string
      default: "1"
      description: "Perform shallow clone"
  workspaces:
    - name: output
      description: "Workspace where repository source is cloned"
  steps:
    - name: clone
      image: alpine/git:2.45.2
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        export HOME="$(workspaces.output.path)"
        export GIT_SSL_NO_VERIFY=true

        TARGET_URL="$(params.url)"

        # Map external gateway hostnames/IPs to the internal in-cluster service for low-latency, zero-SSL failure cloning
        TARGET_URL="$(echo "$TARGET_URL" | sed -E 's|https?://[^/]+/|http://forgejo-git.drr-corpshared-plat.svc.cluster.local:3000/|g')"

        echo "==> Cloning $TARGET_URL at revision $(params.revision) (depth: $(params.depth))..."
        git -c http.sslVerify=false clone --depth "$(params.depth)" --branch "$(params.revision)" "$TARGET_URL" $(workspaces.output.path)/source || \
        git -c http.sslVerify=false clone --depth "$(params.depth)" "$TARGET_URL" $(workspaces.output.path)/source
        cd $(workspaces.output.path)/source
        git checkout "$(params.revision)" || true
        echo "==> Successfully cloned repository. Commit SHA: $(git rev-parse HEAD)"
