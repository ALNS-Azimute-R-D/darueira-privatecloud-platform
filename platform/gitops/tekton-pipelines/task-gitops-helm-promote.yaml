apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-gitops-helm-promote
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Promotes a newly built and verified image tag to the tenant's GitOps Helm chart repository"
  params:
    - name: tenant-name
      type: string
      description: "Tenant owner name"
    - name: app-name
      type: string
      description: "Application repository name"
    - name: chart-repo-name
      type: string
      default: ""
      description: "Helm Chart repository name (defaults to <app-name>-chart)"
    - name: image-tag
      type: string
      description: "Image tag to promote"
    - name: target-env
      type: string
      default: "dev-green"
      description: "Target deployment environment (e.g. dev-green, prod-green)"
    - name: values-file
      type: string
      default: "values-dev-green.yaml"
      description: "Relative path to the values file in the chart repository"
    - name: image-name
      type: string
      default: ""
      description: "Image name to identify backend vs frontend component in multi-app charts"
    - name: git-server
      type: string
      default: "forgejo-git.drr-corpshared-plat.svc.cluster.local:3000"
      description: "In-cluster Git server endpoint"
  steps:
    - name: promote
      image: alpine/git:2.45.2
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/bin/sh
        set -eu

        APP_NAME="$(params.app-name)"
        TENANT="$(params.tenant-name)"
        CHART_REPO="$(params.chart-repo-name)"
        if [ -z "$CHART_REPO" ]; then
          CHART_REPO="${APP_NAME}-chart"
        fi

        TAG="$(params.image-tag)"
        VALUES_FILE="$(params.values-file)"

        echo "=================================================================="
        echo "  Promoting Image Tag to GitOps Helm Chart Repository"
        echo "  Application : $APP_NAME"
        echo "  Chart Repo  : $CHART_REPO"
        echo "  Target Tag  : $TAG"
        echo "  Values File : $VALUES_FILE"
        echo "=================================================================="

        AUTH_USER="drradmin"
        AUTH_PASS="darueira-admin123"
        GIT_HOST="$(params.git-server)"

        CLONE_URL="http://${AUTH_USER}:${AUTH_PASS}@${GIT_HOST}/${TENANT}/${CHART_REPO}.git"

        TMP_DIR="/tmp/chart-repo-$(date +%s)"
        rm -rf "$TMP_DIR"
        git clone "$CLONE_URL" "$TMP_DIR"
        cd "$TMP_DIR"

        git config user.name "Tekton GitOps Promoter"
        git config user.email "gitops-promoter@darueira.local"

        IMG="$(params.image-name)"
        if [ -f "$VALUES_FILE" ]; then
          if grep -q "legalhubMgmt:" "$VALUES_FILE"; then
            awk -v tag="$TAG" '
              /legalhubMgmt:/ { in_sec=1 }
              /fakeAgency:/ { in_sec=0 }
              in_sec && /^[[:space:]]*tag:/ { sub(/tag:[[:space:]]*.*/, "tag: \"" tag "\""); in_sec=0 }
              { print }
            ' "$VALUES_FILE" > "${VALUES_FILE}.tmp" && mv "${VALUES_FILE}.tmp" "$VALUES_FILE"
          elif grep -q "backend:" "$VALUES_FILE" && grep -q "frontend:" "$VALUES_FILE"; then
            if echo "$IMG" | grep -q "backend"; then
              awk -v tag="$TAG" '
                /backend:/ { in_sec=1 }
                /frontend:/ { in_sec=0 }
                in_sec && /^[[:space:]]*tag:/ { sub(/tag:[[:space:]]*.*/, "tag: \"" tag "\""); in_sec=0 }
                { print }
              ' "$VALUES_FILE" > "${VALUES_FILE}.tmp" && mv "${VALUES_FILE}.tmp" "$VALUES_FILE"
            elif echo "$IMG" | grep -q "frontend"; then
              awk -v tag="$TAG" '
                /frontend:/ { in_sec=1 }
                /backend:/ { in_sec=0 }
                in_sec && /^[[:space:]]*tag:/ { sub(/tag:[[:space:]]*.*/, "tag: \"" tag "\""); in_sec=0 }
                { print }
              ' "$VALUES_FILE" > "${VALUES_FILE}.tmp" && mv "${VALUES_FILE}.tmp" "$VALUES_FILE"
            else
              sed -i -E 's/^([[:space:]]*tag:)[[:space:]]*.*/\1 "'"$TAG"'"/' "$VALUES_FILE"
            fi
          else
            sed -i -E 's/^([[:space:]]*tag:)[[:space:]]*.*/\1 "'"$TAG"'"/' "$VALUES_FILE"
          fi
          sed -i -E 's/^([[:space:]]*imageVersion:)[[:space:]]*.*/\1 "'"$TAG"'"/' "$VALUES_FILE"

          git add "$VALUES_FILE"
          if git diff --staged --quiet; then
            echo "==> No changes in $VALUES_FILE (already on tag $TAG)."
          else
            git commit -m "chore(gitops): promote image tag $TAG in $VALUES_FILE [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin master && git push origin master; then
                echo "==> [SUCCESS] Successfully promoted image tag $TAG to $CHART_REPO ($VALUES_FILE)!"
                break
              fi
              echo "==> Push conflict encountered, retrying in 2s ($attempt/5)..."
              sleep 2
            done
          fi
        else
          echo "==> Warning: $VALUES_FILE not found in $CHART_REPO. Available files:"
          ls -la
        fi
