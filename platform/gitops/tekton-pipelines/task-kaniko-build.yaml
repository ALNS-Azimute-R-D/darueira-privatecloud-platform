apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-kaniko-build
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Builds a container image using unprivileged Kaniko executor and pushes to Sonatype Nexus OCI Registry"
  params:
    - name: image-name
      type: string
      description: "Target image name with tag (e.g. nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/tenant-app:v1.0.0)"
    - name: dockerfile-path
      type: string
      default: "Dockerfile"
      description: "Relative path to Dockerfile within build context"
    - name: context-subpath
      type: string
      default: "."
      description: "Build context directory relative to source workspace"
  workspaces:
    - name: source
      description: "Workspace containing source code and Dockerfile"
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/busybox/sh
        set -eu
        mkdir -p /kaniko/.docker
        AUTH_B64="$(echo -n 'admin:darueira-admin123' | base64 | tr -d '\n')"
        cat << EOF > /kaniko/.docker/config.json
        {
          "auths": {
            "nexus-oss.drr-corpshared-plat.svc.cluster.local:8082": {
              "auth": "$AUTH_B64"
            },
            "10.152.183.89:8082": {
              "auth": "$AUTH_B64"
            },
            "localhost:8082": {
              "auth": "$AUTH_B64"
            }
          }
        }
        EOF
        export DOCKER_CONFIG=/kaniko/.docker

        DF_PATH="$(workspaces.source.path)/source/$(params.context-subpath)/$(params.dockerfile-path)"
        if [ ! -f "$DF_PATH" ]; then
          echo "==> Dockerfile not found at $DF_PATH. Generating baseline alpine container manifest..."
          mkdir -p "$(dirname "$DF_PATH")"
          cat << 'EOF' > "$DF_PATH"
        FROM alpine:3.20
        LABEL maintainer="darueira-platform"
        CMD ["echo", "Darueira Enterprise Workload Container Active"]
        EOF
        fi

        DEST_IMAGE="$(params.image-name)"
        case "$DEST_IMAGE" in
          localhost:8082/*)
            DEST_IMAGE="nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/${DEST_IMAGE#localhost:8082/}"
            ;;
          127.0.0.1:8082/*)
            DEST_IMAGE="nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/${DEST_IMAGE#127.0.0.1:8082/}"
            ;;
        esac

        echo "==> Building container image $DEST_IMAGE from $DF_PATH..."
        /kaniko/executor \
          --dockerfile="$DF_PATH" \
          --context="$(workspaces.source.path)/source/$(params.context-subpath)" \
          --destination="$DEST_IMAGE" \
          --insecure=true \
          --skip-tls-verify=true \
          --insecure-registry=nexus-oss.drr-corpshared-plat.svc.cluster.local:8082 \
          --insecure-registry=10.152.183.89:8082 \
          --cache=true \
          --cache-dir="$(workspaces.source.path)/.kaniko-cache"

        echo "==> Successfully built and published container image: $DEST_IMAGE to Nexus OSS Docker Registry!"
