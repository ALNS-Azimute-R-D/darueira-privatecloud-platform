apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-kaniko-build
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Builds a container image using unprivileged Kaniko executor and pushes versioned (YYYY.MMDD.HHMMSS in CET/CEST) and latest tags to Sonatype Nexus OCI Registry"
  params:
    - name: image-name
      type: string
      description: "Target image name (e.g. nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/swfabrik-europe/app-food-market-00-mfe)"
    - name: image-tag
      type: string
      default: "auto"
      description: "Version tag to apply. When 'auto', generates 'YYYY.MMDD.HHMMSS' in CET/CEST timezone."
    - name: dockerfile-path
      type: string
      default: "Dockerfile"
      description: "Relative path to Dockerfile within build context"
    - name: context-subpath
      type: string
      default: "."
      description: "Build context directory relative to source workspace"
  results:
    - name: image-tag
      description: "The concrete version tag assigned to the image"
    - name: image-url
      description: "The full versioned image reference in the registry"
  workspaces:
    - name: source
      description: "Workspace containing source code and Dockerfile"
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/busybox/sh
        set -eu

        # 1. Setup Docker config for Nexus registry
        mkdir -p /kaniko/.docker
        AUTH_B64="$(echo -n 'admin:darueira-admin123' | base64 | tr -d '\n')"
        cat << EOF > /kaniko/.docker/config.json
        {
          "auths": {
            "nexus-oss.drr-corpshared-plat.svc.cluster.local:8082": {
              "auth": "$AUTH_B64"
            },
            "10.152.183.89:8082": {
              "auth": "$AUTH_B64"
            },
            "localhost:8082": {
              "auth": "$AUTH_B64"
            }
          }
        }
        EOF
        export DOCKER_CONFIG=/kaniko/.docker

        # 2. Check Dockerfile
        DF_PATH="$(workspaces.source.path)/source/$(params.context-subpath)/$(params.dockerfile-path)"
        if [ ! -f "$DF_PATH" ]; then
          echo "==> Dockerfile not found at $DF_PATH. Generating baseline alpine container manifest..."
          mkdir -p "$(dirname "$DF_PATH")"
          cat << 'EOF' > "$DF_PATH"
        FROM alpine:3.20
        LABEL maintainer="darueira-platform"
        CMD ["echo", "Darueira Enterprise Workload Container Active"]
        EOF
        fi

        # 3. Calculate CET/CEST timestamped tag: YYYY.MMDD.HHMMSS
        export TZ="CET-1CEST,M3.5.0,M10.5.0/3"
        TAG="$(params.image-tag)"
        if [ -z "$TAG" ] || [ "$TAG" = "auto" ] || [ "$TAG" = "latest" ]; then
          TAG="$(date +'%Y.%m%d.%H%M%S')"
        fi

        # 4. Resolve Image Base Name
        RAW_IMAGE="$(params.image-name)"
        case "$RAW_IMAGE" in
          localhost:8082/*)
            RAW_IMAGE="nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/${RAW_IMAGE#localhost:8082/}"
            ;;
          127.0.0.1:8082/*)
            RAW_IMAGE="nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/${RAW_IMAGE#127.0.0.1:8082/}"
            ;;
        esac

        PREFIX="${RAW_IMAGE%/*}"
        IMAGE_AND_TAG="${RAW_IMAGE##*/}"
        if echo "$IMAGE_AND_TAG" | grep -q ":"; then
          IMAGE_NAME_ONLY="${IMAGE_AND_TAG%%:*}"
        else
          IMAGE_NAME_ONLY="$IMAGE_AND_TAG"
        fi

        IMAGE_BASE="${PREFIX}/${IMAGE_NAME_ONLY}"
        DEST_VERSIONED="${IMAGE_BASE}:${TAG}"
        DEST_LATEST="${IMAGE_BASE}:latest"

        echo "=================================================================="
        echo "  Building Container Image with Tag Pattern: YYYY.MMDD.HHMMSS (CET/CEST)"
        echo "  Version Tag : $TAG"
        echo "  Destination : $DEST_VERSIONED"
        echo "  Latest Tag  : $DEST_LATEST"
        echo "  Dockerfile  : $DF_PATH"
        echo "=================================================================="

        # 5. Build and Push via Kaniko (both versioned tag and latest tag)
        /kaniko/executor \
          --dockerfile="$DF_PATH" \
          --context="$(workspaces.source.path)/source/$(params.context-subpath)" \
          --destination="$DEST_VERSIONED" \
          --destination="$DEST_LATEST" \
          --insecure=true \
          --skip-tls-verify=true \
          --insecure-registry=nexus-oss.drr-corpshared-plat.svc.cluster.local:8082 \
          --insecure-registry=10.152.183.89:8082 \
          --cache=true \
          --cache-dir="$(workspaces.source.path)/.kaniko-cache"

        # 6. Record Task Results
        echo -n "$TAG" > "$(results.image-tag.path)"
        echo -n "$DEST_VERSIONED" > "$(results.image-url.path)"

        echo "==> [SUCCESS] Published versioned image: $DEST_VERSIONED"
        echo "==> [SUCCESS] Published latest image:    $DEST_LATEST"
