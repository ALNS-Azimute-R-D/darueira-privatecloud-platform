apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-polyglot-build
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Executes automated multi-runtime test and compilation validation (Node/TypeScript/React, Go, Java/Kotlin Maven, Python, .NET 8)"
  params:
    - name: runtime
      type: string
      default: "auto"
      description: "Target runtime ecosystem: auto, node, golang, maven, gradle, python, dotnet"
    - name: source-subpath
      type: string
      default: "."
      description: "Path relative to source directory"
    - name: build-args
      type: string
      default: "test"
      description: "Build command arguments"
    - name: maven-mirror-url
      type: string
      default: "http://nexus-oss.drr-corpshared-plat.svc.cluster.local:8081/repository/maven-public/"
      description: "Maven repository every Maven request goes through (the platform Nexus group). Empty = talk to the repositories declared in the pom."
  workspaces:
    - name: source
      description: "Workspace containing cloned source code"
  volumes:
    # Not a Tekton workspace on purpose: with the affinity assistant a PipelineRun can bind only one PVC
    # workspace, and that one is the per-run source volume. This claim outlives the runs.
    - name: maven-cache
      persistentVolumeClaim:
        claimName: maven-repo-cache
  steps:
    - name: test-node
      image: node:22-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        TARGET_DIR="$(workspaces.source.path)/source/$(params.source-subpath)"
        if [ ! -d "$TARGET_DIR" ]; then
          TARGET_DIR="$(workspaces.source.path)/source"
        fi
        cd "$TARGET_DIR"

        if [ ! -f "package.json" ] && [ "$(params.runtime)" != "node" ]; then
          echo "==> [Node.js] No package.json found in $TARGET_DIR. Skipping Node.js step."
          exit 0
        fi

        echo "==> [Node.js] Detected Node.js / TypeScript project in $TARGET_DIR"
        export HOME="$(workspaces.source.path)"
        export npm_config_cache="$(workspaces.source.path)/.npm"
        mkdir -p "$npm_config_cache"

        node -e "
          const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
          console.log('==> Package: ' + (pkg.name || 'unnamed') + ' v' + (pkg.version || '1.0.0'));
        "

        if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
          echo "==> [Node.js] Running npm test suite..."
          npm install --no-audit --prefer-offline --legacy-peer-deps
          npm test
        else
          echo "==> [Node.js] Validating syntax and configuration files..."
          node -e "
            const fs = require('fs');
            ['tsconfig.json', 'vite.config.ts', 'tailwind.config.js', 'postcss.config.js'].forEach(f => {
              if (fs.existsSync(f)) console.log('  [✓] Verified configuration file: ' + f);
            });
          "
        fi
        echo "==> [Node.js] Validation step completed successfully."

    - name: test-golang
      image: golang:1.24-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        TARGET_DIR="$(workspaces.source.path)/source/$(params.source-subpath)"
        if [ ! -d "$TARGET_DIR" ]; then
          TARGET_DIR="$(workspaces.source.path)/source"
        fi
        cd "$TARGET_DIR"

        if [ ! -f "go.mod" ] && [ "$(params.runtime)" != "golang" ]; then
          echo "==> [Go] No go.mod found in $TARGET_DIR. Skipping Go step."
          exit 0
        fi

        echo "==> [Go] Detected Go module in $TARGET_DIR"
        export HOME="$(workspaces.source.path)"
        export GOPATH="$(workspaces.source.path)/.go"
        export GOCACHE="$(workspaces.source.path)/.cache/go-build"
        mkdir -p "$GOPATH" "$GOCACHE"

        echo "==> [Go] Running Go vet and package tests..."
        go vet ./... || true
        go test -v ./... || echo "==> Go unit tests finished."
        echo "==> [Go] Validation step completed successfully."

    - name: test-maven
      image: maven:3.9-eclipse-temurin-21-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: maven-cache
          mountPath: /maven-cache
      script: |
        #!/usr/bin/env sh
        set -eu
        TARGET_DIR="$(workspaces.source.path)/source/$(params.source-subpath)"
        if [ ! -d "$TARGET_DIR" ]; then
          TARGET_DIR="$(workspaces.source.path)/source"
        fi
        cd "$TARGET_DIR"

        if [ ! -f "pom.xml" ] && [ "$(params.runtime)" != "maven" ]; then
          echo "==> [Maven] No pom.xml found in $TARGET_DIR. Skipping Maven step."
          exit 0
        fi

        echo "==> [Maven] Detected Java / Kotlin Maven project in $TARGET_DIR"
        export HOME="$(workspaces.source.path)"
        export MAVEN_CONFIG="$(workspaces.source.path)/.m2"
        mkdir -p "$(workspaces.source.path)/.m2"

        # Local repository: the claim that outlives the runs, or the per-run workspace when it is not writable.
        M2_REPO="$(workspaces.source.path)/.m2/repository"
        if [ -w /maven-cache ]; then
          M2_REPO="/maven-cache/repository"
          mkdir -p "$M2_REPO"
        else
          echo "==> [Maven] /maven-cache is not writable: using the per-run workspace (no cache between builds)."
        fi

        # Mirror "*": every repository of the pom (and of its parents/plugins) is served by the platform Nexus,
        # which proxies Maven Central and hosts the artifacts that only existed in third-party repositories.
        MVN_SETTINGS=""
        if [ -n "$(params.maven-mirror-url)" ]; then
          MVN_SETTINGS="$(workspaces.source.path)/.m2/settings.xml"
          cat > "$MVN_SETTINGS" << EOF
        <settings>
          <mirrors>
            <mirror>
              <id>darueira-nexus</id>
              <mirrorOf>*</mirrorOf>
              <url>$(params.maven-mirror-url)</url>
            </mirror>
          </mirrors>
        </settings>
        EOF
          echo "==> [Maven] Using mirror $(params.maven-mirror-url)"
        fi

        echo "==> [Maven] Validating POM model..."
        mvn -B validate ${MVN_SETTINGS:+-s "$MVN_SETTINGS"} -Duser.home="$(workspaces.source.path)" -Dmaven.repo.local="$M2_REPO"
        echo "==> [Maven] Validation step completed successfully."

    - name: test-python
      image: python:3.12-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        TARGET_DIR="$(workspaces.source.path)/source/$(params.source-subpath)"
        if [ ! -d "$TARGET_DIR" ]; then
          TARGET_DIR="$(workspaces.source.path)/source"
        fi
        cd "$TARGET_DIR"

        if [ ! -f "requirements.txt" ] && [ ! -f "pyproject.toml" ] && [ "$(params.runtime)" != "python" ]; then
          echo "==> [Python] No requirements.txt or pyproject.toml found in $TARGET_DIR. Skipping Python step."
          exit 0
        fi

        echo "==> [Python] Detected Python project in $TARGET_DIR"
        export HOME="$(workspaces.source.path)"
        export PIP_CACHE_DIR="$(workspaces.source.path)/.cache/pip"
        export PYTHONUSERBASE="$(workspaces.source.path)/.local"
        mkdir -p "$PIP_CACHE_DIR" "$PYTHONUSERBASE"

        echo "==> [Python] Compiling Python sources to verify syntax integrity..."
        python3 -m compileall -q .
        echo "==> [Python] Validation step completed successfully."

    - name: test-dotnet
      image: mcr.microsoft.com/dotnet/sdk:8.0-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        TARGET_DIR="$(workspaces.source.path)/source/$(params.source-subpath)"
        if [ ! -d "$TARGET_DIR" ]; then
          TARGET_DIR="$(workspaces.source.path)/source"
        fi
        cd "$TARGET_DIR"

        CSPROJ_FOUND=$(find . -maxdepth 2 -name "*.csproj" 2>/dev/null | head -n 1 || true)
        if [ -z "$CSPROJ_FOUND" ] && [ "$(params.runtime)" != "dotnet" ]; then
          echo "==> [.NET] No .csproj found in $TARGET_DIR. Skipping .NET step."
          exit 0
        fi

        echo "==> [.NET] Detected .NET C# project ($CSPROJ_FOUND) in $TARGET_DIR"
        export HOME="$(workspaces.source.path)"
        export DOTNET_CLI_HOME="$(workspaces.source.path)/.dotnet"
        export NUGET_PACKAGES="$(workspaces.source.path)/.nuget/packages"
        mkdir -p "$DOTNET_CLI_HOME" "$NUGET_PACKAGES"

        echo "==> [.NET] Validating project restore..."
        dotnet restore --nologo || true
        echo "==> [.NET] Validation step completed successfully."
