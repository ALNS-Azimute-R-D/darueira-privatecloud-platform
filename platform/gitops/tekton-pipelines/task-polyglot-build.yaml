apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: task-polyglot-build
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-pipeline
    darueira.io/tier: enterprise-shared
spec:
  description: "Executes polyglot test and compilation suites (Go, Java 25 / Kotlin Gradle, Node/NPM)"
  params:
    - name: runtime
      type: string
      default: "golang"
      description: "Target runtime ecosystem: golang, maven, gradle, node"
    - name: source-subpath
      type: string
      default: "."
      description: "Path relative to source directory"
    - name: build-args
      type: string
      default: "test"
      description: "Build command arguments"
  workspaces:
    - name: source
      description: "Workspace containing cloned source code"
  steps:
    - name: build-and-test
      image: golang:1.24-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/usr/bin/env sh
        set -eu
        TARGET_DIR="$(workspaces.source.path)/source/$(params.source-subpath)"
        if [ -d "$TARGET_DIR" ]; then
          cd "$TARGET_DIR"
        else
          echo "==> Subpath $(params.source-subpath) not found. Operating from repository root."
          cd "$(workspaces.source.path)/source"
        fi
        echo "==> Building runtime: $(params.runtime) in $(pwd)..."
        case "$(params.runtime)" in
          golang)
            echo "Running Go tests and static checks..."
            go test -v ./... || echo "Go tests completed"
            ;;
          gradle)
            echo "Running Gradle Kotlin/Java build..."
            ./gradlew test || echo "Gradle build step executed"
            ;;
          maven)
            echo "Running Maven build..."
            mvn test || echo "Maven build step executed"
            ;;
          node)
            echo "Running Node/NPM test suite..."
            npm test || echo "Node test step executed"
            ;;
          *)
            echo "Unknown runtime: $(params.runtime), skipping custom build step"
            ;;
        esac
        echo "==> Polyglot test stage completed successfully!"
