apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: forgejo-push-binding
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-triggers
    darueira.io/tier: enterprise-shared
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
    - name: repository-name
      value: $(body.repository.name)
    - name: owner-name
      value: $(body.repository.owner.username)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: forgejo-pipeline-template
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-triggers
    darueira.io/tier: enterprise-shared
spec:
  params:
    - name: git-url
      description: "Repository clone URL"
    - name: git-revision
      description: "Commit SHA or branch"
    - name: repository-name
      description: "Name of the Git repository"
    - name: owner-name
      description: "Owner organization or user of the Git repository"
      default: "swfabrik-europe"
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: "forgejo-ci-$(tt.params.repository-name)-"
        namespace: drr-corpshared-mgmt
        labels:
          darueira.io/tier: enterprise-shared
          darueira.io/triggered-by: forgejo-webhook
          darueira.io/tenant: $(tt.params.owner-name)
      spec:
        pipelineRef:
          name: standard-ci-cd-pipeline
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-name
            value: "nexus-oss.drr-corpshared-plat.svc.cluster.local:8082/$(tt.params.owner-name)/$(tt.params.repository-name)"
          - name: image-tag
            value: "auto"
          - name: tenant-name
            value: $(tt.params.owner-name)
          - name: app-name
            value: $(tt.params.repository-name)
          - name: target-env
            value: "dev-green"
          - name: argocd-app-name
            value: "$(tt.params.owner-name)-$(tt.params.repository-name)"
        workspaces:
          - name: pipeline-workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: forgejo-webhook-listener
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/component: ci-triggers
    darueira.io/tier: enterprise-shared
spec:
  serviceAccountName: tekton-triggers-controller
  triggers:
    - name: forgejo-events
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: "filter"
              value: "body.ref == 'refs/heads/master' && !body.repository.name.endsWith('-chart')"
      bindings:
        - ref: forgejo-push-binding
      template:
        ref: forgejo-pipeline-template
