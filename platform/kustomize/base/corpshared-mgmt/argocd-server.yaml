apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: argocd-repo-server
    app.kubernetes.io/component: repo-server
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-repo-server
        darueira.io/tier: enterprise-shared
    spec:
      serviceAccountName: argocd-repo-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: repo-server
          image: quay.io/argoproj/argocd:v2.13.3
          imagePullPolicy: IfNotPresent
          command:
            - argocd-repo-server
          args:
            - --redis
            - argocd-redis.drr-corpshared-mgmt.svc.cluster.local:6379
          ports:
            - containerPort: 8081
              name: server
            - containerPort: 8084
              name: metrics
          env:
            - name: ARGOCD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ARGOCD_REPOSERVER_PARALLELISM_LIMIT
              value: "10"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: argocd-repo-server-tls
              mountPath: /app/config/tls
            - name: gpg-keys
              mountPath: /app/config/gpg/keys
            - name: gpg-source
              mountPath: /app/config/gpg/source
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
            - name: tls-certs
              mountPath: /app/config/ssl
      volumes:
        - name: tmp
          emptyDir: {}
        - name: argocd-repo-server-tls
          emptyDir: {}
        - name: gpg-keys
          emptyDir: {}
        - name: gpg-source
          emptyDir: {}
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
        - name: tls-certs
          configMap:
            name: argocd-tls-certs-cm
---
