apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/component: server
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
        darueira.io/tier: enterprise-shared
    spec:
      serviceAccountName: argocd-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: quay.io/argoproj/argocd:v2.13.3
          imagePullPolicy: IfNotPresent
          command:
            - argocd-server
          args:
            - --insecure
            - --staticassets
            - /shared/app
            - --redis
            - argocd-redis.drr-corpshared-mgmt.svc.cluster.local:6379
            - --repo-server
            - argocd-repo-server.drr-corpshared-mgmt.svc.cluster.local:8081
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8083
              name: metrics
          env:
            - name: ARGOCD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
            - name: tls-certs
              mountPath: /app/config/ssl
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
        - name: tls-certs
          configMap:
            name: argocd-tls-certs-cm
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: argocd-server
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-server
