apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server-placeholder
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: argocd-server
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argocd-server
          image: alpine:3.20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - "echo 'ArgoCD GitOps server placeholder ready'; while true; do sleep 3600; done"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ARGOCD_NAMESPACE
              value: drr-corpshared-mgmt
            - name: USER
              value: "10001"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: drr-corpshared-mgmt
data:
  server.insecure: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: drr-corpshared-mgmt
data:
  server.insecure: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: drr-corpshared-mgmt
type: Opaque
data:
  admin.password: JDJhJDEwJHgySjN0QUYvRklCSGhaUFBvR1l4ZE9Oa0lrdk50a005N3N3MkdPSTN3eUd1eVQ3N0F6U3Vx # dev-password
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: argocd-server
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - port: 8080
      targetPort: 8080
      name: http
