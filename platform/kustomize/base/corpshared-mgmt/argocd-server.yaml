apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server-placeholder
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: argocd-server
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argocd-server
          image: node:20-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - node
            - -e
            - "const http = require('http'); http.createServer((req, res) => { res.writeHead(200, {'Content-Type': 'application/json'}); res.end(JSON.stringify({service: 'argocd-gitops-server', status: 'UP'})); }).listen(8080, '0.0.0.0', () => console.log('ArgoCD server listening on 8080'));"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ARGOCD_NAMESPACE
              value: drr-corpshared-mgmt
            - name: USER
              value: "10001"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: drr-corpshared-mgmt
data:
  server.insecure: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: drr-corpshared-mgmt
data:
  server.insecure: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: drr-corpshared-mgmt
type: Opaque
data:
  admin.password: JDJhJDEwJHgySjN0QUYvRklCSGhaUFBvR1l4ZE9Oa0lrdk50a005N3N3MkdPSTN3eUd1eVQ3N0F6U3Vx # dev-password
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: argocd-server
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8080
