      parameters:
      - title: Service Details
        required:
        - component_id
        - owner
        properties:
          component_id:
            title: Service Name
            type: string
            description: Name of the Go microservice
          owner:
            title: Owner
            type: string
            ui:field: OwnerPicker
      steps:
      - id: log-scaffolding
        name: Scaffolding Go Service
        action: debug:log
        input:
          message: 'Scaffolding Go microservice: ${{ parameters.component_id }}'
      output:
        links:
        - title: Repository
          url: https://git.darueira-corpshared.127.0.0.1.nip.io
