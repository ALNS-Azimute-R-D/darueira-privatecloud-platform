      name: go-microservice-template
      title: Go / Gin Ultra-Fast Microservice
      description: Scaffolds a high-throughput Go service using Gin, OpenTelemetry tracing,
        Prometheus metrics endpoint, Docker multi-stage build, and APISIX routing.
      tags:
      - golang
      - gin
      - backend
      - fast
      - api
    spec:
