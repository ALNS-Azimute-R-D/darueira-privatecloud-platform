apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-app-config
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: backstage
    darueira.io/tier: enterprise-shared
data:
  app-config.yaml: |
    app:
      title: Darueira Developer Portal
      baseUrl: https://backstage.darueira-corpshared.127.0.0.1.nip.io

    organization:
      name: Darueira Private Cloud Platform

    backend:
      baseUrl: https://backstage.darueira-corpshared.127.0.0.1.nip.io
      listen:
        port: 7007
        host: 0.0.0.0
      cors:
        origin: https://backstage.darueira-corpshared.127.0.0.1.nip.io
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      auth:
        keys:
          - secret: "darueira-backstage-jwt-secret-key-2026-very-secure"
      database:
        client: pg
        connection:
          host: central-postgres.drr-corpshared-plat.svc.cluster.local
          port: 5432
          user: drr_admin
          password: change-me-in-openbao
          database: drr_backstage_db
          ssl: false
        ensureSchemaExists: true

    dynamicPlugins:
      rootDirectory: 'dynamic-plugins-root'

    integrations:
      github:
        - host: git.darueira-corpshared.127.0.0.1.nip.io
          apiBaseUrl: https://git.darueira-corpshared.127.0.0.1.nip.io/api/v1
      gitlab:
        - host: gitlab.com

    proxy:
      '/sonarqube':
        target: 'http://127.0.0.1:9000'
      '/jenkins/api':
        target: 'http://127.0.0.1:8080'
      '/jira/api':
        target: 'https://jira.example.com'
      '/acr/api':
        target: 'https://example.azurecr.io'
      '/jfrog-artifactory/api':
        target: 'https://artifactory.example.com'
      '/dynatrace':
        target: 'https://dynatrace.example.com'
      '/nexus-repository-manager':
        target: 'http://nexus-oss.drr-corpshared-plat.svc.cluster.local:8081'

    argocd:
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: darueira-argocd
              url: https://argocd.darueira-corpshared.127.0.0.1.nip.io

    kubernetes:
      serviceLocatorMethod:
        type: 'multiTenant'
      clusterLocatorMethods:
        - type: 'config'
          clusters:
            - url: https://kubernetes.default.svc
              name: local-cluster
              authProvider: 'serviceAccount'
              skipTLSVerify: true

    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Group, User]
      locations:
        - type: file
          target: /opt/catalog-entities/all.yaml
          rules:
            - allow: [Component, System, API, Resource, Location, Template, Group, User]
---
