      steps:
      - id: log-scaffolding
        name: Scaffolding Frontend
        action: debug:log
        input:
          message: 'Scaffolding React microfrontend: ${{ parameters.component_id }}'
      output:
        links:
        - title: Repository
          url: https://git.darueira-corpshared.127.0.0.1.nip.io
    ---
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: tenant-provisioning-template
      title: Provision New Platform Tenant
      description: Automated Golden Path to provision a complete isolated tenant environment
        (Namespace, PostgreSQL DBs, Schemas, OpenBao Secrets, Keycloak Realm, NetworkPolicies).
      tags:
      - platform
      - tenant
      - automation
      - multi-tenancy
    spec:
      owner: group:platform-core-team
      type: environment
      parameters:
      - title: Tenant Identification
        required:
        - tenant_id
        - tenant_name
        properties:
          tenant_id:
            title: Tenant Identifier
            type: string
            description: Lowercase alphanumeric identifier (e.g. globex, initech, wayne)
          tenant_name:
            title: Tenant Display Name
            type: string
            description: Full company name (e.g. Globex Corporation)
      steps:
      - id: log-scaffolding
        name: Provisioning Tenant Plane
        action: debug:log
        input:
          message: 'Provisioning tenant environment for: ${{ parameters.tenant_name }}
            (${{ parameters.tenant_id }})'
      output:
        links:
        - title: ArgoCD Applications
          url: https://argocd.darueira-corpshared.127.0.0.1.nip.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: drr-corpshared-mgmt
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/part-of: darueira-platform
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: quay.io/janus-idp/backstage-showcase:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 7007
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: POSTGRES_HOST
              value: "central-postgres.drr-corpshared-plat.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "drr_admin"
            - name: POSTGRES_PASSWORD
              value: "change-me-in-openbao"
            - name: POSTGRES_DB
              value: "drr_backstage_db"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          volumeMounts:
            - name: config-volume
              mountPath: /opt/app-root/src/app-config.yaml
              subPath: app-config.yaml
            - name: catalog-volume
              mountPath: /opt/catalog-entities/all.yaml
              subPath: all.yaml
      volumes:
        - name: config-volume
          configMap:
            name: backstage-app-config
        - name: catalog-volume
          configMap:
            name: backstage-catalog-entities
