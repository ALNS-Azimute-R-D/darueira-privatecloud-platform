# Alertmanager configuration (ADR-0020, backlog item 48). The webhook URL is a Secret (url_file), never a value in Git.
# Every alert goes to two places: the webhook (default: an in-cluster receiver that logs it) and an e-mail to the platform admin and to andre.nascimento
# mailbox on the in-cluster Stalwart, sent with an authenticated account so that it is not treated as spam.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h

# A critical alert of a service hides the warnings of the same service: one page, not two.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service]

receivers:
  - name: default
    webhook_configs:
      - url_file: /etc/alertmanager/webhook/url
        send_resolved: true
        max_alerts: 20
    email_configs:
      - to: "admin@darueira.local, andre.nascimento@darueira.local"
        from: alertmanager@darueira.local
        # Authenticated submission (implicit TLS on 465; Stalwart has no listener on 587). The account is a user of the
        # Authentik directory created by scripts/provision_alertmanager_mail.py; the password is the Secret alertmanager-smtp.
        smarthost: stalwart-mail.drr-corpshared-plat.svc.cluster.local:465
        auth_username: alertmanager@darueira.local
        auth_password_file: /etc/alertmanager/smtp/password
        hello: alertmanager.drr-corpshared-obs.svc.cluster.local
        require_tls: true
        tls_config:
          insecure_skip_verify: true   # lab: the Stalwart certificate is not issued by a CA the pod trusts
        send_resolved: true
