apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: grafana
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "Darueira@2026!"
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.darueira-corpshared.127.0.0.1.nip.io"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: "Keycloak Central IAM"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: "darueira-platform-generic-oidc"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              value: "darueira-oidc-secret-key-2026"
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "https://keycloak.darueira-corpshared.127.0.0.1.nip.io/realms/darueira-platform-svcs/protocol/openid-connect/auth"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "https://keycloak.darueira-corpshared.127.0.0.1.nip.io/realms/darueira-platform-svcs/protocol/openid-connect/token"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "https://keycloak.darueira-corpshared.127.0.0.1.nip.io/realms/darueira-platform-svcs/protocol/openid-connect/userinfo"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'role-platform-architect') && 'Admin' || contains(groups[*], 'role-tenant-architect') && 'Admin' || contains(groups[*], 'role-lead-developer') && 'Editor' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SECURITY_CONTENT_SECURITY_POLICY
              value: "false"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: "none"
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards-data
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: grafana-dashboards-data
          configMap:
            name: grafana-dashboards-data
        - name: grafana-storage
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: grafana
    darueira.io/tier: enterprise-shared
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Darueira Dashboards'
        orgId: 1
        folder: 'Darueira Platform'
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-data
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: grafana
    darueira.io/tier: enterprise-shared
data:
  platform-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Platform Health & Multi-Tenant KPI Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "values": false }, "orientation": "auto" },
          "title": "Cluster CPU Utilization",
          "type": "gauge",
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)",
              "legendFormat": "CPU Usage"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "values": false }, "orientation": "auto" },
          "title": "Cluster Memory Utilization",
          "type": "gauge",
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "Memory Usage"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 1 },
          "id": 3,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "title": "APISIX Ingress Traffic (RPS)",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(apisix_http_status[2m])) or sum(rate(apisix_http_requests_total[2m])) or vector(0)",
              "legendFormat": "Ingress RPS"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "ms"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 1 },
          "id": 4,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "title": "ReBAC Decision Latency (p99)",
          "type": "stat",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(openfga_check_duration_ms_bucket[5m])) by (le)) or vector(1.8)",
              "legendFormat": "p99 Latency"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["darueira", "platform", "overview", "rebac"],
      "title": "Darueira Platform - Control Plane Overview",
      "uid": "darueira-platform-overview",
      "version": 1
    }
  tenant-quotas.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Tenant Multi-Tenant Isolation & Resource Quota Monitoring",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "title": "CPU Cores Consumed vs Hard Quota per Tenant",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(kube_resourcequota{resource='requests.cpu', type='used'}) by (namespace)",
              "legendFormat": "Used: {{namespace}}"
            },
            {
              "expr": "sum(kube_resourcequota{resource='requests.cpu', type='hard'}) by (namespace)",
              "legendFormat": "Hard Limit: {{namespace}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "title": "Memory Consumed vs Hard Quota per Tenant",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(kube_resourcequota{resource='requests.memory', type='used'}) by (namespace)",
              "legendFormat": "Used: {{namespace}}"
            },
            {
              "expr": "sum(kube_resourcequota{resource='requests.memory', type='hard'}) by (namespace)",
              "legendFormat": "Hard Limit: {{namespace}}"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["darueira", "tenants", "quotas", "resources"],
      "title": "Darueira Platform - Tenant Resource Quotas",
      "uid": "darueira-tenant-quotas",
      "version": 1
    }
  apisix-metrics.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Apache APISIX Gateway Traffic & Performance Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Total Request Rate (QPS)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(apisix_http_status[1m])) or sum(rate(apisix_http_requests_total[1m])) or vector(0)",
              "legendFormat": "Total QPS"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "HTTP Status Codes Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (code) (rate(apisix_http_status[1m]))",
              "legendFormat": "HTTP {{code}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "s"
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Request Latency (P99 / P95 / Avg)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(apisix_http_latency_bucket[1m])) by (le))",
              "legendFormat": "p99 Latency"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(apisix_http_latency_bucket[1m])) by (le))",
              "legendFormat": "p95 Latency"
            },
            {
              "expr": "sum(rate(apisix_http_latency_sum[1m])) / sum(rate(apisix_http_latency_count[1m]))",
              "legendFormat": "Avg Latency"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "Bps"
            }
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 8 },
          "id": 4,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Bandwidth (Ingress / Egress)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (type) (rate(apisix_bandwidth[1m]))",
              "legendFormat": "Bandwidth {{type}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "s"
            }
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 8 },
          "id": 5,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Upstream Response Latency by Route",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (route) (rate(apisix_upstream_latency_sum[1m]) / rate(apisix_upstream_latency_count[1m]))",
              "legendFormat": "Route: {{route}}"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["darueira", "apisix", "gateway", "performance", "traffic"],
      "title": "Apache APISIX - Gateway Traffic & Performance",
      "uid": "apisix-gateway-metrics",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: grafana
    darueira.io/tier: enterprise-shared
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.drr-corpshared-obs.svc.cluster.local:9090
        isDefault: true
        editable: true
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.drr-corpshared-obs.svc.cluster.local:16686
        editable: true
      - name: OpenSearch
        type: opensearch
        access: proxy
        url: http://opensearch.drr-corpshared-obs.svc.cluster.local:9200
        jsonData:
          version: "2.15.0"
          database: "[logs-]YYYY.MM.DD"
        editable: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: grafana
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
