apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: jaeger
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          # Pinned to 2.20.0 on purpose: v2.21.0 removed the v1 HTTP API (/api/services, /api/traces) that the Grafana Jaeger
          # datasource (plugin 13.x) still calls. Move to the latest once the plugin uses /api/v3 (ADR-0020).
          image: jaegertracing/jaeger:2.20.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 14268
              name: jaeger-http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: jaeger
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      name: ui
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 14268
      targetPort: 14268
      name: jaeger-http
