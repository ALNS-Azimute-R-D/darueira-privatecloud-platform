apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: drr-corpshared-obs

resources:
  - namespace.yaml
  - network-policy.yaml
  - otel-collector.yaml
  - prometheus.yaml
  - grafana.yaml
  - jaeger.yaml
  - opensearch.yaml
  - opensearch-dashboards.yaml
  - fluent-bit.yaml
  - exporters.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: opensearch-dashboards-saved-objects
    files:
      - opensearch-saved-objects.ndjson=dashboards/opensearch-saved-objects.ndjson
  - name: prometheus-rules
    files:
      - alerts/iam-authz.rules.yml
    options:
      labels:
        app.kubernetes.io/name: prometheus
        darueira.io/tier: enterprise-shared
  - name: grafana-dashboards-data
    files:
      - dashboards/grafana/apisix-metrics.json
      - dashboards/grafana/k8s-pod-resource-analytics.json
      - dashboards/grafana/platform-overview.json
      - dashboards/grafana/tenant-resources.json
      - dashboards/grafana/containers-health.json
      - dashboards/grafana/keycloak-jvm.json
      - dashboards/grafana/observability-stack.json
      - dashboards/grafana/kubernetes-state.json
      - dashboards/grafana/host-node.json
      - dashboards/grafana/postgresql.json
      - dashboards/grafana/iam-authz.json
    options:
      labels:
        app.kubernetes.io/name: grafana
        darueira.io/tier: enterprise-shared
