apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-and-obs-rules
  namespace: drr-corpshared-obs
spec:
  endpointSelector:
    matchLabels:
      darueira.io/tier: enterprise-shared
  ingress:
    # 1. Allow OTLP ingestion from all internal platform and tenant workloads.
    # NOTE (2026-09-23): a namespaced CiliumNetworkPolicy implicitly scopes
    # plain matchLabels to its own namespace (the `any:` label-source prefix
    # does NOT bypass this — confirmed empirically via `cilium policy
    # selectors`, which still showed the auto-injected
    # `k8s.io.kubernetes.pod.namespace` constraint alongside `any:...`).
    # The only mechanism that works is explicitly setting
    # `k8s:io.kubernetes.pod.namespace` to the target namespace per entry,
    # so this rule enumerates every enterprise-shared and tenant namespace
    # that legitimately sends OTLP/logs here. New tenant namespace = must
    # add an entry here (and to the egress scrape rule below) manually —
    # no generic "any namespace" selector exists in a namespaced
    # CiliumNetworkPolicy. See docs/runbooks/cilium-cni-migration.md Fase 3.
    - fromEndpoints: &cross-ns-obs-sources
        - matchLabels:
            darueira.io/tier: enterprise-shared
            k8s:io.kubernetes.pod.namespace: drr-corpshared-obs
        - matchLabels:
            darueira.io/tier: enterprise-shared
            k8s:io.kubernetes.pod.namespace: drr-corpshared-mgmt
        - matchLabels:
            darueira.io/tier: enterprise-shared
            k8s:io.kubernetes.pod.namespace: drr-corpshared-plat
        - matchLabels:
            darueira.io/tier: enterprise-shared
            k8s:io.kubernetes.pod.namespace: drr-corpshared-secr-internal
        # NOTE (2026-09-23): only enumerate tenant namespaces that are
        # actually meant to exist. 8 stale/demo namespaces (acme-storefront
        # x3, globex-logistics x2, darueira-corp-platform-core-prod,
        # swfabrik-europe-marketplaces-dev, base-template) were deleted from
        # the cluster — see docs/runbooks/cilium-cni-migration.md Fase 3 —
        # do not re-add them here without confirming they're legitimate.
        - matchLabels:
            darueira.io/tier: tenant-workload
            k8s:io.kubernetes.pod.namespace: drr-tnt-swfabrik-europe-dev
        - matchLabels:
            darueira.io/tier: tenant-workload
            k8s:io.kubernetes.pod.namespace: drr-tnt-swfabrik-latam-dev
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
            - port: "8889"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "16686"
              protocol: TCP
            - port: "9200"
              protocol: TCP
    # 2. Allow intra-observability traffic (same-namespace by design, no
    #    explicit namespace needed — default scoping is correct here).
    - fromEndpoints:
        - matchLabels:
            darueira.io/subsystem: observability
  egress:
    # 1. CoreDNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    # 2. Allow intra-observability and scrape platform/tenant services.
    #    Same enumerated cross-namespace set as ingress rule 1 above,
    #    reused via YAML anchor to avoid the two lists drifting apart.
    - toEndpoints: *cross-ns-obs-sources
    # 3. Cluster-wide fallback (matches the pattern already proven working in
    #    corpshared-plat/mgmt/secr-internal's network-policy.yaml). Added
    #    2026-09-22: the CoreDNS-specific rule above (#1) was not being matched
    #    in practice once Cilium started enforcing this policy (verified via
    #    Hubble: "policy denied" on UDP/53 to kube-system/kube-dns even though
    #    its labels matched exactly), breaking DNS for prometheus and
    #    fluent-bit. Keeping rule #1 for documentation intent, but this
    #    broader rule is what actually restores DNS/cluster connectivity.
    #    IMPORTANT: `world` must be included alongside `cluster`, confirmed by
    #    isolated testing (minimal policy, fresh pod, egress-only) -
    #    `toEntities: [cluster]` alone was NOT enough to reach CoreDNS's
    #    ClusterIP; only `[cluster, world]` together worked. This cluster runs
    #    with KubeProxyReplacement disabled (kube-proxy does the Service
    #    ClusterIP DNAT via iptables, not Cilium natively), which is the
    #    likely reason the pre-DNAT ClusterIP isn't classified as `cluster`
    #    alone by Cilium's identity resolution for this traffic pattern.
    - toEntities:
        - cluster
        - world
