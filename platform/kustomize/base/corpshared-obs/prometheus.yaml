apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: prometheus
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: drr-corpshared-obs
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector.drr-corpshared-obs.svc.cluster.local:8889"]

      - job_name: "drr-iam-authz-svc"
        static_configs:
          - targets: ["drr-iam-authz-svc.drr-corpshared-plat.svc.cluster.local:8080"]

      - job_name: "keycloak"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["keycloak.drr-corpshared-plat.svc.cluster.local:9000"]

      - job_name: "apisix-gateway"
        metrics_path: "/apisix/prometheus/metrics"
        static_configs:
          - targets: ["apisix-gateway.drr-corpshared-plat.svc.cluster.local:9091"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: prometheus
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
