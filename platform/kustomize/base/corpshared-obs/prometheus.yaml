apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: prometheus
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  # Recreate: the TSDB directory is locked by the running pod (RWO volume), so a RollingUpdate pod crash-loops until the old one exits.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-rules
              mountPath: /etc/prometheus-rules
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: prometheus
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  volumeName: pv-drr-prometheus-data
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: drr-corpshared-obs
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.drr-corpshared-obs.svc.cluster.local:9093"]

    # Alerting rules (ConfigMap prometheus-rules); notifications go through Alertmanager (webhook, backlog item 48).
    rule_files:
      - /etc/prometheus-rules/*.yml

    scrape_configs:
      - job_name: "kubernetes-nodes-cadvisor"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: "node-exporter"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [drr-corpshared-obs]
            selectors:
              - role: pod
                label: "app.kubernetes.io/name=node-exporter"
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__address__]
            regex: "(.+):.*"
            target_label: __address__
            replacement: "$1:9100"

      - job_name: "kube-state-metrics"
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics.drr-corpshared-obs.svc.cluster.local:8080"]

      - job_name: "postgres"
        static_configs:
          - targets: ["postgres-exporter-central.drr-corpshared-obs.svc.cluster.local:9187"]
            labels: {instance_name: central-postgres, tier: enterprise-shared}
          - targets: ["postgres-exporter-europe.drr-corpshared-obs.svc.cluster.local:9187"]
            labels: {instance_name: tenant-postgres-europe, tier: tenant-workload}
          - targets: ["postgres-exporter-latam.drr-corpshared-obs.svc.cluster.local:9187"]
            labels: {instance_name: tenant-postgres-latam, tier: tenant-workload}

      - job_name: "alertmanager"
        static_configs:
          - targets: ["alertmanager.drr-corpshared-obs.svc.cluster.local:9093"]

      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector.drr-corpshared-obs.svc.cluster.local:8889"]

      - job_name: "drr-iam-authz-svc"
        static_configs:
          - targets: ["drr-iam-authz-svc.drr-corpshared-plat.svc.cluster.local:9102"]

      - job_name: "keycloak"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["keycloak.drr-corpshared-plat.svc.cluster.local:9000"]

      - job_name: "apisix-gateway"
        metrics_path: "/apisix/prometheus/metrics"
        static_configs:
          - targets: ["apisix-gateway.drr-corpshared-plat.svc.cluster.local:9091"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: drr-corpshared-obs
  labels:
    app.kubernetes.io/name: prometheus
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
