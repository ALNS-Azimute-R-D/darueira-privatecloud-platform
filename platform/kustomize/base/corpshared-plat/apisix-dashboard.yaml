apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-dashboard-conf
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-dashboard
    darueira.io/tier: enterprise-shared
data:
  conf.yaml: |
    conf:
      listen:
        port: 9000
      etcd:
        endpoints:
          - 127.0.0.1:2379
      log:
        error_log:
          level: warn
          file_path: /dev/stderr
        access_log:
          file_path: /dev/stdout
      max_cpu: 0
    authentication:
      secret: darueira-apisix-dashboard-jwt-token-key-2026
      expire_time: 86400
      users:
        - username: admin
          password: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-dashboard
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-dashboard
    app.kubernetes.io/component: admin-console
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix-dashboard
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.15
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /usr/local/bin/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://127.0.0.1:2379
            - --data-dir=/etcd-data
          ports:
            - containerPort: 2379
              name: etcd
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
        - name: dashboard
          image: apache/apisix-dashboard:3.0.1-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 9000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config-vol
              mountPath: /usr/local/apisix-dashboard/conf/conf.yaml
              subPath: conf.yaml
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: etcd-data
          emptyDir: {}
        - name: config-vol
          configMap:
            name: apisix-dashboard-conf
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-dashboard
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-dashboard
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apisix-dashboard
  ports:
    - port: 9000
      targetPort: 9000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-dashboard
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apisix-dashboard
  ports:
    - port: 2379
      targetPort: 2379
      name: etcd
