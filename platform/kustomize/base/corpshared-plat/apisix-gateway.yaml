spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apisix-gateway
  ports:
    - port: 80
      targetPort: 9080
      nodePort: 30080
      name: http
    - port: 443
      targetPort: 9443
      nodePort: 30443
      name: https
    - port: 9080
      targetPort: 9080
      nodePort: 30980
      name: http-direct
    - port: 9443
      targetPort: 9443
      nodePort: 30444
      name: https-direct
    - port: 9091
      targetPort: 9091
      name: prometheus
    - port: 9180
      targetPort: 9180
      name: admin
