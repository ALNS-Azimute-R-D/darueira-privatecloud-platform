apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-gateway
    darueira.io/tier: enterprise-shared
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      ssl:
        enable: true
        listen:
          - port: 9443
        ssl_protocols: "TLSv1.2 TLSv1.3"
      enable_admin: true
      enable_control: true
      control:
        ip: "0.0.0.0"
        port: 9090
      prometheus:
        export_uri: /apisix/prometheus/metrics
        export_addr:
          ip: "0.0.0.0"
          port: 9091
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      etcd:
        host:
          - "http://apisix-etcd.drr-corpshared-plat.svc.cluster.local:2379"
        prefix: "/apisix"
        timeout: 30
      admin:
        allow_admin:
          - 0.0.0.0/0
        admin_key:
          - name: admin
            key: edd1c9f034335f136f87ad84b625c8f1
            role: admin
    nginx_config:
      http_configuration_snippet: |
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 256k;
        large_client_header_buffers 4 64k;
        client_header_buffer_size 16k;
    plugin_attr:
      prometheus:
        export_uri: /apisix/prometheus/metrics
        export_addr:
          ip: "0.0.0.0"
          port: 9091
    plugins:
      - openid-connect
      - forward-auth
      - prometheus
      - cors
      - proxy-rewrite
      - response-rewrite
      - limit-req
      - limit-count
      - ip-restriction
  # No apisix.yaml here on purpose. With config_provider: etcd (above),
  # APISIX ignores conf/apisix.yaml entirely: routes live in etcd and
  # scripts/bootstrap_apisix_routes.py is their single source of truth
  # (`make bootstrap-apisix` to seed, `make check-apisix-routes` to diff).
  # A 43-route apisix.yaml used to sit here, never loaded; some of its
  # routes were hand-copied into etcd, others never went live. Removed
  # 2026-09-23; recoverable from git history.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-gateway
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-gateway
    app.kubernetes.io/component: edge-gateway
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix-gateway
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-conf
          image: apache/apisix:3.17.0-debian
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - cp -r /usr/local/apisix/conf/* /conf-dest/ && cp -f /config-source/* /conf-dest/ && cp -r /usr/local/apisix/apisix/* /apisix-lib-dest/ && sed -i 's/local port = port_from_host or api_ctx.var.server_port/local port = port_from_host or (proto == "https" and "443" or "80")/g' /apisix-lib-dest/init.lua && sed -i 's/local host = http_host/local host = http_host:match("^([^:]+)") or http_host/g' /apisix-lib-dest/init.lua
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: conf-dir
              mountPath: /conf-dest
            - name: apisix-lib-dir
              mountPath: /apisix-lib-dest
      containers:
        - name: apisix
          image: apache/apisix:3.17.0-debian
          imagePullPolicy: IfNotPresent
          args:
            - docker-start
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9443
              name: https
            - containerPort: 9090
              name: control
            - containerPort: 9091
              name: prometheus
            - containerPort: 9180
              name: admin
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: conf-dir
              mountPath: /usr/local/apisix/conf
            - name: apisix-lib-dir
              mountPath: /usr/local/apisix/apisix
            - name: logs-dir
              mountPath: /usr/local/apisix/logs
            - name: temp-dir
              mountPath: /usr/local/apisix/client_body_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/proxy_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/fastcgi_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/uwsgi_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/scgi_temp
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config-source
          configMap:
            name: apisix-config
        - name: conf-dir
          emptyDir: {}
        - name: apisix-lib-dir
          emptyDir: {}
        - name: logs-dir
          emptyDir: {}
        - name: temp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-gateway
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-gateway
    darueira.io/tier: enterprise-shared
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apisix-gateway
  ports:
    - port: 80
      targetPort: 9080
      nodePort: 30080
      name: http
    - port: 443
      targetPort: 9443
      nodePort: 30443
      name: https
    - port: 9080
      targetPort: 9080
      nodePort: 30980
      name: http-direct
    - port: 9443
      targetPort: 9443
      nodePort: 30444
      name: https-direct
    - port: 9091
      targetPort: 9091
      name: prometheus
    - port: 9180
      targetPort: 9180
      name: admin
