apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-gateway
    darueira.io/tier: enterprise-shared
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      ssl:
        enable: true
        listen:
          - port: 9443
        ssl_protocols: "TLSv1.2 TLSv1.3"
      enable_admin: true
      enable_control: true
      control:
        ip: "0.0.0.0"
        port: 9090
      prometheus:
        export_uri: /apisix/prometheus/metrics
        export_addr:
          ip: "0.0.0.0"
          port: 9091
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      etcd:
        host:
          - "http://apisix-etcd.drr-corpshared-plat.svc.cluster.local:2379"
        prefix: "/apisix"
        timeout: 30
      admin:
        admin_key:
          - name: admin
            key: edd1c9f034335f136f87ad84b625c8f1
            role: admin
    plugin_attr:
      prometheus:
        export_uri: /apisix/prometheus/metrics
        export_addr:
          ip: "0.0.0.0"
          port: 9091
    plugins:
      - forward-auth
      - prometheus
      - cors
      - proxy-rewrite
      - response-rewrite
      - limit-req
      - limit-count
      - ip-restriction
