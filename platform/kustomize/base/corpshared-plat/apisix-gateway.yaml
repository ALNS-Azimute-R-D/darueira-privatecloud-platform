      - id: route-api-tenants
        uri: /api/v1/tenants*
        upstream:
          nodes:
            "drr-tenant-svc.drr-corpshared-plat.svc.cluster.local:8081": 1
          type: roundrobin

      - id: route-api-environments
        uri: /api/v1/environments*
        upstream:
          nodes:
            "drr-env-orchestrator-svc.drr-corpshared-mgmt.svc.cluster.local:8082": 1
          type: roundrobin
    #END
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-gateway
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-gateway
    app.kubernetes.io/component: edge-gateway
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix-gateway
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-conf
          image: apache/apisix:3.17.0-debian
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - cp -r /usr/local/apisix/conf/* /conf-dest/ && cp -f /config-source/* /conf-dest/ && cp -r /usr/local/apisix/apisix/* /apisix-lib-dest/ && sed -i 's/local port = port_from_host or api_ctx.var.server_port/local port = port_from_host or (proto == "https" and "443" or "80")/g' /apisix-lib-dest/init.lua && sed -i 's/local host = http_host/local host = http_host:match("^([^:]+)") or http_host/g' /apisix-lib-dest/init.lua
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: conf-dir
              mountPath: /conf-dest
            - name: apisix-lib-dir
              mountPath: /apisix-lib-dest
      containers:
        - name: apisix
          image: apache/apisix:3.17.0-debian
          imagePullPolicy: IfNotPresent
          args:
            - docker-start
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9443
              name: https
            - containerPort: 9090
              name: control
            - containerPort: 9091
              name: prometheus
            - containerPort: 9180
              name: admin
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: conf-dir
              mountPath: /usr/local/apisix/conf
            - name: apisix-lib-dir
              mountPath: /usr/local/apisix/apisix
            - name: logs-dir
              mountPath: /usr/local/apisix/logs
            - name: temp-dir
              mountPath: /usr/local/apisix/client_body_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/proxy_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/fastcgi_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/uwsgi_temp
            - name: temp-dir
              mountPath: /usr/local/apisix/scgi_temp
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config-source
          configMap:
            name: apisix-config
        - name: conf-dir
          emptyDir: {}
        - name: apisix-lib-dir
          emptyDir: {}
        - name: logs-dir
          emptyDir: {}
        - name: temp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-gateway
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: apisix-gateway
