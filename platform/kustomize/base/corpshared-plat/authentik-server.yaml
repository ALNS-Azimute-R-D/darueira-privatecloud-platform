apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: authentik-server
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-server
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --dir
            - /data
          volumeMounts:
            - name: redis-data
              mountPath: /data
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: server
          image: ghcr.io/goauthentik/server:2026.5.6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args: ["server"]
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          env:
            - name: AUTHENTIK_REDIS__HOST
              value: "127.0.0.1"
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "central-postgres.drr-corpshared-plat.svc.cluster.local"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "drr_admin"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              value: "change-me-in-openbao"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "drr_authentik_db"
            - name: AUTHENTIK_SECRET_KEY
              value: "change-me-in-openbao-authentik-key"
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              value: "darueira-admin123"
            - name: AUTHENTIK_BOOTSTRAP_EMAIL
              value: "admin@darueira.local"
          volumeMounts:
            - name: media-storage
              mountPath: /media
            - name: certs-storage
              mountPath: /certs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
        - name: worker
          image: ghcr.io/goauthentik/server:2026.5.6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args: ["worker"]
          env:
            - name: AUTHENTIK_REDIS__HOST
              value: "127.0.0.1"
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "central-postgres.drr-corpshared-plat.svc.cluster.local"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "drr_admin"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              value: "change-me-in-openbao"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "drr_authentik_db"
            - name: AUTHENTIK_SECRET_KEY
              value: "change-me-in-openbao-authentik-key"
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              value: "darueira-admin123"
            - name: AUTHENTIK_BOOTSTRAP_EMAIL
              value: "admin@darueira.local"
          volumeMounts:
            - name: media-storage
              mountPath: /media
            - name: certs-storage
              mountPath: /certs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: media-storage
          emptyDir: {}
        - name: certs-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: authentik-server
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik-server
  ports:
    - port: 9000
      targetPort: 9000
      name: http
    - port: 9443
      targetPort: 9443
      name: https
