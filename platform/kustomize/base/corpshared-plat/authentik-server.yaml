apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: authentik-server
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-server
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: beryju/authentik:2024.4.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          args: ["server"]
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "central-postgres.drr-corpshared-plat.svc.cluster.local"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "drr_admin"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              value: "change-me-in-openbao-drr-admin-pw"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "authentik"
            - name: AUTHENTIK_SECRET_KEY
              value: "change-me-in-openbao-authentik-key"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: authentik-server
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik-server
  ports:
    - port: 9000
      targetPort: 9000
      name: http
    - port: 9443
      targetPort: 9443
      name: https
