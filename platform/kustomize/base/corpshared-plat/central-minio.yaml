apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: central-minio-pvc
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-minio
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-minio
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-minio
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: central-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-minio
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-05-10T01-41-38Z
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "Darueira@2026!"
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "https://minio.darueira-corpshared.127.0.0.1.nip.io"
            - name: MINIO_IDENTITY_OPENID_CONFIG_URL
              value: "http://keycloak.drr-corpshared-plat.svc.cluster.local:8080/realms/darueira-platform-svcs/.well-known/openid-configuration"
            - name: MINIO_IDENTITY_OPENID_CLIENT_ID
              value: "darueira-platform-generic-oidc"
            - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
              value: "darueira-oidc-secret-key-2026"
            - name: MINIO_IDENTITY_OPENID_CLAIM_NAME
              value: "policy"
            - name: MINIO_IDENTITY_OPENID_ROLE_POLICY
              value: "consoleAdmin"
            - name: MINIO_IDENTITY_OPENID_SCOPES
              value: "openid,profile,email"
            - name: MINIO_IDENTITY_OPENID_REDIRECT_URI
              value: "https://minio.darueira-corpshared.127.0.0.1.nip.io/oauth_callback"
            - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
              value: "Keycloak Central IAM"
            - name: SSL_CERT_FILE
              value: "/certs/CAs/darueira-ca.crt"
            - name: SSL_CERT_DIR
              value: "/certs/CAs"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: minio-data
              mountPath: /data
            - name: darueira-tls-ca
              mountPath: /certs/CAs/darueira-ca.crt
              subPath: darueira-ca.crt
        - name: bucket-provisioner
          image: minio/mc:RELEASE.2024-05-09T17-04-24Z
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: "/tmp/.mc"
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Central MinIO server..."
              until /usr/bin/mc alias set local http://127.0.0.1:9000 minioadmin 'Darueira@2026!'; do
                sleep 2
              done
              echo "Central MinIO ready. Ensuring standard corporate buckets exist..."
              /usr/bin/mc mb -p local/drr-corp-techdocs || true
              /usr/bin/mc mb -p local/drr-corp-backups || true
              /usr/bin/mc mb -p local/drr-corp-artifacts || true
              /usr/bin/mc mb -p local/drr-corp-mail-storage || true
              /usr/bin/mc mb -p local/drr-corp-logs-archive || true
              echo "Configuring OpenID policy attachments..."
              /usr/bin/mc admin policy attach local consoleAdmin --group "role-platform-architect" || true
              /usr/bin/mc admin policy attach local consoleAdmin --group "role-tenant-architect" || true
              /usr/bin/mc admin policy attach local readwrite --group "role-lead-developer" || true
              /usr/bin/mc admin policy attach local readonly --group "role-developer" || true
              /usr/bin/mc admin policy attach local consoleAdmin --user "andre.nascimento@darueira.local" || true
              /usr/bin/mc admin policy attach local consoleAdmin --user "admin-root" || true
              echo "Corporate buckets and OpenID RBAC successfully verified!"
              tail -f /dev/null
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: central-minio-pvc
        - name: darueira-tls-ca
          secret:
            secretName: darueira-wildcard-tls
            items:
              - key: ca.crt
                path: darueira-ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: central-minio
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-minio
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: central-minio
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
