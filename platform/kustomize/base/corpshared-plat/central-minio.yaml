apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: central-minio-pvc
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-minio
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-minio
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-minio
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: central-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-minio
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-05-10T01-41-38Z
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin-change-me"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: minio-data
              mountPath: /data
        - name: bucket-provisioner
          image: minio/mc:RELEASE.2024-05-09T17-04-24Z
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: "/tmp/.mc"
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Central MinIO server..."
              until /usr/bin/mc alias set local http://127.0.0.1:9000 minioadmin minioadmin-change-me; do
                sleep 2
              done
              echo "Central MinIO ready. Ensuring standard corporate buckets exist..."
              /usr/bin/mc mb -p local/drr-corp-techdocs || true
              /usr/bin/mc mb -p local/drr-corp-backups || true
              /usr/bin/mc mb -p local/drr-corp-artifacts || true
              /usr/bin/mc mb -p local/drr-corp-mail-storage || true
              /usr/bin/mc mb -p local/drr-corp-logs-archive || true
              echo "Corporate buckets successfully verified!"
              tail -f /dev/null
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: central-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: central-minio
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-minio
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: central-minio
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
