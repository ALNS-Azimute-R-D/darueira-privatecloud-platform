apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: central-postgres
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-postgres
    darueira.io/tier: enterprise-shared
spec:
  serviceName: central-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: central-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-postgres
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "drr_keycloak_db"
            - name: POSTGRES_USER
              value: "drr_admin"
            - name: POSTGRES_PASSWORD
              value: "change-me-in-openbao"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: central-postgres
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-postgres
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: central-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
