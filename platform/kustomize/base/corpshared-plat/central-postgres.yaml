apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: central-postgres
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-postgres
    darueira.io/tier: enterprise-shared
spec:
  serviceName: central-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: central-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-postgres
        darueira.io/tier: enterprise-shared
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: nbalns-mifcom-lnx-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          # Shared by ~12 platform DBs, each with its own client pool; the default of 100 is too
          # tight (see temporal.yaml SQL_MAX_* for the biggest consumer).
          args:
            - "-c"
            - "max_connections=200"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "drr_keycloak_db"
            - name: POSTGRES_USER
              value: "drr_admin"
            - name: POSTGRES_PASSWORD
              value: "change-me-in-openbao"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_admin -d drr_keycloak_db
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_admin -d drr_keycloak_db
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_admin -d drr_keycloak_db
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: darueira-host-storage
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: central-postgres
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-postgres
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: central-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
