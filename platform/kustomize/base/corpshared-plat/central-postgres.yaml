apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: central-postgres
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-postgres
    darueira.io/tier: enterprise-shared
spec:
  serviceName: central-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: central-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-postgres
        darueira.io/tier: enterprise-shared
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: nbalns-mifcom-lnx-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          # Shared by ~12 platform DBs, each with its own client pool; the default of 100 is too
          # tight (see temporal.yaml SQL_MAX_* for the biggest consumer).
          args:
            - "-c"
            - "max_connections=200"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "drr_keycloak_db"
            - name: POSTGRES_USER
              value: "drr_admin"
            - name: POSTGRES_PASSWORD
              value: "change-me-in-openbao"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Raised from 1000m: shared by ~16 DBs, and the host (a laptop running the whole
              # lab plus IDE/browser) sometimes starves this cgroup under load, which previously
              # tripped the liveness probe and got the whole pod SIGKILLed even though Postgres
              # itself was healthy (see docs/runbooks/host-disk-io-contention.md).
              cpu: 2000m
              memory: 2048Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_admin -d drr_keycloak_db
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            # Raised from 180 (30 min): on this host's mechanical disk, the mandatory
            # "syncing data directory (fsync)" startup pass has been observed to exceed 30 min
            # (see docs/runbooks/host-disk-io-contention.md) and the pod was being SIGKILLed by
            # this very probe mid-fsync, forcing it to restart the whole pass from scratch every
            # time — a self-inflicted crash loop. 720 gives up to 2h before giving up.
            failureThreshold: 720
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_admin -d drr_keycloak_db
            initialDelaySeconds: 5
            periodSeconds: 5
            # timeoutSeconds/failureThreshold widened so a brief CPU stall on the host (an exec
            # probe needs a fork+scheduler slice) doesn't flip readiness off under load.
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_admin -d drr_keycloak_db
            initialDelaySeconds: 15
            periodSeconds: 10
            # Widened from timeoutSeconds=5/failureThreshold=6 (60s tolerance): under host memory
            # pressure the pg_isready exec can miss a tight timeout even though Postgres itself is
            # fine, and the pod was getting SIGKILLed and restarted for no real reason.
            timeoutSeconds: 10
            failureThreshold: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: darueira-host-storage
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: central-postgres
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: central-postgres
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: central-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
