apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-and-plat-rules
  namespace: drr-corpshared-plat
spec:
  endpointSelector: {}
  ingress:
    # NOTE (2026-09-23): explicit `k8s:io.kubernetes.pod.namespace` per
    # entry required — a namespaced CiliumNetworkPolicy implicitly scopes
    # plain matchLabels to its own namespace, and the `any:` label-source
    # prefix does NOT bypass that (confirmed empirically, see
    # docs/runbooks/cilium-cni-migration.md Fase 3). Was masked here by the
    # fromEntities fallback below (note this rule also lacks
    # tenant-workload/port 7233 for Temporal — currently harmless only
    # because that fallback covers it; tenant access relies entirely on
    # fromEntities: [cluster, host] below, not on this rule).
    - fromEndpoints: &sibling-enterprise-shared
        - matchLabels:
            darueira.io/tier: enterprise-shared
            k8s:io.kubernetes.pod.namespace: drr-corpshared-mgmt
        - matchLabels:
            darueira.io/tier: enterprise-shared
            k8s:io.kubernetes.pod.namespace: drr-corpshared-obs
        - matchLabels:
            darueira.io/tier: enterprise-shared
            k8s:io.kubernetes.pod.namespace: drr-corpshared-secr-internal
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "2222"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "9000"
              protocol: TCP
            - port: "9001"
              protocol: TCP
            - port: "9092"
              protocol: TCP
            - port: "9644"
              protocol: TCP
            - port: "5672"
              protocol: TCP
            - port: "15672"
              protocol: TCP
            - port: "25"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "993"
              protocol: TCP
    - fromEntities:
        - cluster
        - host
  egress:
    - toEndpoints: *sibling-enterprise-shared
    - toEntities:
        - cluster
        - world
