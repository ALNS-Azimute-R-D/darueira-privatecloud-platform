apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-mail
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: stalwart-mail
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart-mail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-mail
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: "10.152.183.121"
          hostnames:
            - "keycloak.darueira-corpshared.127.0.0.1.nip.io"
            - "keycloak.darueira-corpshared.local"
            - "mail.darueira-corpshared.127.0.0.1.nip.io"
            - "mail.darueira-corpshared.local"
            - "authentik.darueira-corpshared.127.0.0.1.nip.io"
            - "authentik.darueira-corpshared.local"
      initContainers:
        - name: setup-ca-certs
          image: stalwartlabs/stalwart:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              cp -r /etc/ssl/certs/* /tmp/ssl-certs/
              cat /tmp/custom-ca/ca.crt >> /tmp/ssl-certs/ca-certificates.crt
              cp /tmp/custom-ca/ca.crt /tmp/ssl-certs/b889551d.0
              cp /tmp/custom-ca/ca.crt /tmp/ssl-certs/darueira-ca.pem
          volumeMounts:
            - name: ca-bundle-vol
              mountPath: /tmp/ssl-certs
            - name: darueira-tls-secret
              mountPath: /tmp/custom-ca
      containers:
        - name: stalwart-mail
          image: stalwartlabs/stalwart:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - containerPort: 8080
              name: http-admin
            - containerPort: 25
              name: smtp
            - containerPort: 465
              name: smtps
            - containerPort: 587
              name: submission
            - containerPort: 993
              name: imaps
          env:
            - name: STALWART_RECOVERY_ADMIN
              value: "admin:darueira-admin123"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/ca-certificates.crt"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: stalwart-config-vol
              mountPath: /etc/stalwart
            - name: mail-data
              mountPath: /var/lib/stalwart
            - name: ca-bundle-vol
              mountPath: /etc/ssl/certs
      volumes:
        - name: stalwart-config-vol
          configMap:
            name: stalwart-config
        - name: mail-data
          persistentVolumeClaim:
            claimName: stalwart-mail-pvc
        - name: ca-bundle-vol
          emptyDir: {}
        - name: darueira-tls-secret
          secret:
            secretName: darueira-wildcard-tls
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: stalwart-mail
    darueira.io/tier: enterprise-shared
data:
  config.json: |
    {
      "@type": "PostgreSql",
      "timeout": 15000,
      "useTls": false,
      "allowInvalidCerts": false,
      "poolMaxConnections": 10,
      "poolRecyclingMethod": "fast",
      "readReplicas": {},
      "host": "central-postgres",
      "port": 5432,
      "database": "drr_stalwart_mailserver_db",
      "authUsername": "drr_admin",
      "authSecret": {
        "@type": "Value",
        "secret": "change-me-in-openbao"
      },
      "options": null
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-mail-pvc
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: stalwart-mail
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: stalwart-mail
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stalwart-mail
  ports:
    - port: 8080
      targetPort: 8080
      name: http-admin
    - port: 25
      targetPort: 25
      name: smtp
    - port: 465
      targetPort: 465
      name: smtps
    - port: 587
      targetPort: 587
      name: submission
    - port: 993
      targetPort: 993
      name: imaps
