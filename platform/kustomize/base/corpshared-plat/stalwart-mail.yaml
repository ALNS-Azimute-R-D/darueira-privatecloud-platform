apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-mail
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: stalwart-mail
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart-mail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-mail
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart-mail
          image: stalwartlabs/mail-server:v0.8.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http-admin
            - containerPort: 25
              name: smtp
            - containerPort: 993
              name: imaps
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mail-data
              mountPath: /opt/stalwart-mail
      volumes:
        - name: mail-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: stalwart-mail
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stalwart-mail
  ports:
    - port: 8080
      targetPort: 8080
      name: http-admin
    - port: 25
      targetPort: 25
      name: smtp
    - port: 993
      targetPort: 993
      name: imaps
