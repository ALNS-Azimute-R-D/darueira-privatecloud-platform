apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-pvc
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: temporal
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  volumeName: pv-drr-temporal
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: temporal-server
    app.kubernetes.io/component: workflow-engine
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-server
        app.kubernetes.io/component: workflow-engine
        darueira.io/tier: enterprise-shared
    spec:
      nodeSelector:
        kubernetes.io/hostname: nbalns-mifcom-lnx-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-server
          image: temporalio/auto-setup:1.24.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 7233
              name: grpc-frontend
            - containerPort: 7234
              name: grpc-history
            - containerPort: 7235
              name: grpc-matching
            - containerPort: 7239
              name: grpc-internal
            - containerPort: 9090
              name: metrics
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "drr_admin"
            - name: POSTGRES_PWD
              value: "change-me-in-openbao"
            - name: POSTGRES_SEEDS
              value: "central-postgres.drr-corpshared-plat.svc.cluster.local"
            - name: DBNAME
              value: "drr_temporal_db"
            - name: VISIBILITY_DBNAME
              value: "drr_temporal_visibility_db"
            - name: DEFAULT_NAMESPACE
              value: "corporate-core"
            - name: SERVICES
              value: "frontend,matching,history,worker"
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TEMPORAL_CLI_ADDRESS
              value: "127.0.0.1:7233"
            - name: NUM_HISTORY_SHARDS
              value: "4"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          volumeMounts:
            - name: temporal-data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: temporal-data
          persistentVolumeClaim:
            claimName: temporal-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: temporal-server
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-server
  ports:
    - port: 7233
      targetPort: 7233
      name: grpc-frontend
    - port: 9090
      targetPort: 9090
      name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/component: workflow-ui
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
        app.kubernetes.io/component: workflow-ui
        darueira.io/tier: enterprise-shared
    spec:
      nodeSelector:
        kubernetes.io/hostname: nbalns-mifcom-lnx-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.30.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal-frontend.drr-corpshared-plat.svc.cluster.local:7233"
            - name: TEMPORAL_CORS_ORIGINS
              value: "http://localhost:3000,https://temporal.darueira-corpshared.127.0.0.1.nip.io,https://temporal.darueira-corpshared.192.168.178.84.nip.io,https://temporal.darueira-corpshared.127.0.0.1.sslip.io,https://temporal.darueira-corpshared.local"
            - name: PORT
              value: "8080"
            - name: TEMPORAL_AUTH_ENABLED
              value: "true"
            - name: TEMPORAL_AUTH_LABEL
              value: "Keycloak Corporate SSO"
            - name: TEMPORAL_AUTH_TYPE
              value: "oidc"
            - name: TEMPORAL_AUTH_PROVIDER_URL
              value: "https://keycloak.darueira-corpshared.127.0.0.1.nip.io/realms/darueira-platform-svcs"
            - name: TEMPORAL_AUTH_ISSUER_URL
              value: "https://keycloak.darueira-corpshared.127.0.0.1.nip.io/realms/darueira-platform-svcs"
            - name: TEMPORAL_AUTH_CLIENT_ID
              value: "darueira-platform-generic-oidc"
            - name: TEMPORAL_AUTH_CLIENT_SECRET
              value: "darueira-oidc-secret-key-2026"
            - name: TEMPORAL_AUTH_CALLBACK_URL
              value: "https://temporal.darueira-corpshared.127.0.0.1.nip.io/auth/sso/callback"
            - name: TEMPORAL_AUTH_SCOPES
              value: "openid,profile,email"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/darueira-ca.crt"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: ui-config
              mountPath: /home/ui-server/config
            - name: darueira-ca
              mountPath: /etc/ssl/certs/darueira-ca.crt
              subPath: ca.crt
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: ui-config
          emptyDir: {}
        - name: darueira-ca
          secret:
            secretName: darueira-wildcard-tls
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui-svc
  namespace: drr-corpshared-plat
  labels:
    app.kubernetes.io/name: temporal-ui
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - port: 8080
      targetPort: 8080
      name: http
