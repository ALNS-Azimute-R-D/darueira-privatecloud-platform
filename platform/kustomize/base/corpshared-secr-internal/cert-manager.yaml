apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-controller
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: cert-manager
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cert-manager
          image: quay.io/jetstack/cert-manager-controller:v1.15.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --v=2
            - --cluster-resource-namespace=drr-corpshared-secr-internal
            - --leader-election-namespace=drr-corpshared-secr-internal
          ports:
            - containerPort: 9402
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cert-manager
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: cert-manager
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cert-manager
  ports:
    - port: 9402
      targetPort: 9402
      name: metrics
