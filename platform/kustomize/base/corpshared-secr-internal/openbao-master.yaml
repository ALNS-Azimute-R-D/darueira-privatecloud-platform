apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-master-pvc
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-master-config
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
data:
  bao.json: |
    {
      "listener": {
        "tcp": {
          "address": "0.0.0.0:8200",
          "tls_disable": true
        }
      },
      "storage": {
        "file": {
          "path": "/vault/data"
        }
      },
      "ui": true,
      "default_lease_ttl": "720h",
      "max_lease_ttl": "8760h",
      "disable_mlock": true
    }
  entrypoint.sh: |
    #!/bin/sh
    export VAULT_ADDR="http://127.0.0.1:8200"

    echo "=================================================="
    echo "  Starting OpenBao Master Enterprise Storage Node "
    echo "=================================================="

    # Start OpenBao server in the background
    bao server -config=/vault/config/bao.json &
    BAO_PID=$!

    # Wait for HTTP endpoint
    echo "==> Waiting for OpenBao HTTP port 8200..."
    until wget -q -O- http://127.0.0.1:8200/v1/sys/init >/dev/null 2>&1; do
      sleep 1
    done

    # Check if initialized
    INIT_STATUS=$(wget -q -O- http://127.0.0.1:8200/v1/sys/init 2>/dev/null || echo '{"initialized":false}')
    if echo "$INIT_STATUS" | grep -q '"initialized":false'; then
      echo "==> [INIT] Initializing OpenBao with 1 unseal share..."
      INIT_OUTPUT=$(bao operator init -key-shares=1 -key-threshold=1)
      UNSEAL_KEY=$(echo "$INIT_OUTPUT" | grep 'Unseal Key 1:' | awk '{print $NF}')
      ROOT_TOKEN=$(echo "$INIT_OUTPUT" | grep 'Initial Root Token:' | awk '{print $NF}')

      echo "UNSEAL_KEY=${UNSEAL_KEY}" > /vault/data/.vault-keys.env
      echo "ROOT_TOKEN=${ROOT_TOKEN}" >> /vault/data/.vault-keys.env
      chmod 600 /vault/data/.vault-keys.env
      echo "==> [INIT] Initialization complete. Keys stored securely in /vault/data/.vault-keys.env"
    fi

    # Check seal status and unseal
    SEAL_STATUS=$(wget -q -O- http://127.0.0.1:8200/v1/sys/seal-status 2>/dev/null || echo '{"sealed":true}')
    if echo "$SEAL_STATUS" | grep -q '"sealed":true'; then
      if [ -f /vault/data/.vault-keys.env ]; then
        . /vault/data/.vault-keys.env
        if [ -n "$UNSEAL_KEY" ]; then
          echo "==> [UNSEAL] Unsealing OpenBao..."
          bao operator unseal "$UNSEAL_KEY"
          echo "==> [UNSEAL] Successfully unsealed!"
        fi
      fi
    fi

    # Ensure predefined root token and secret engine
    if [ -f /vault/data/.vault-keys.env ]; then
      . /vault/data/.vault-keys.env
      TARGET_TOKEN="${PREDEFINED_ROOT_TOKEN:-darueira-root-token}"
      env VAULT_TOKEN="$ROOT_TOKEN" bao token create -id="$TARGET_TOKEN" -policy="root" -orphan=true -period="0" >/dev/null 2>&1 || true
      env VAULT_TOKEN="$ROOT_TOKEN" bao secrets enable -path=secret kv-v2 >/dev/null 2>&1 || true
    fi

    echo "==> [READY] OpenBao Master is fully operational, unsealed, and serving requests on 0.0.0.0:8200"
    wait $BAO_PID
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-master
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-master
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: nbalns-mifcom-lnx-01
      containers:
        - name: openbao
          image: openbao/openbao:2.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - "/bin/sh"
            - "/vault/config/entrypoint.sh"
          env:
            - name: HOME
              value: /vault/data
            - name: PREDEFINED_ROOT_TOKEN
              value: "darueira-root-token"
            - name: VAULT_UI
              value: "true"
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bao-data
              mountPath: /vault/data
            - name: bao-config
              mountPath: /vault/config
          startupProbe:
            httpGet:
              path: /v1/sys/health?uninitcode=200&sealedcode=200
              port: 8200
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: bao-data
          persistentVolumeClaim:
            claimName: openbao-master-pvc
        - name: bao-config
          configMap:
            name: openbao-master-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-master
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openbao-master
  ports:
    - port: 8200
      targetPort: 8200
      name: http
