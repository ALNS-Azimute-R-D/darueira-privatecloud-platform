apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-master
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-master
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: hashicorp/vault:1.17.6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - "vault"
            - "server"
            - "-dev"
            - "-dev-listen-address=0.0.0.0:8200"
            - "-dev-root-token-id=darueira-root-token"
            - "-dev-no-store-token"
          env:
            - name: HOME
              value: /vault/data
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
            - name: VAULT_UI
              value: "true"
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bao-data
              mountPath: /vault/data
          livenessProbe:
            httpGet:
              path: /v1/sys/health?uninitcode=200&sealedcode=200
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/sys/health?uninitcode=200&sealedcode=200
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: bao-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-master
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openbao-master
  ports:
    - port: 8200
      targetPort: 8200
      name: http
