apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-master
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-master
        darueira.io/tier: enterprise-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:2.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - "bao"
            - "server"
            - "-dev"
            - "-dev-listen-address=0.0.0.0:8200"
            - "-dev-root-token-id=root-token-for-dev-bootstrap"
            - "-dev-no-store-token"
          env:
            - name: HOME
              value: /bao/data
            - name: BAO_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bao-data
              mountPath: /bao/data
      volumes:
        - name: bao-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-master
  namespace: drr-corpshared-secr-internal
  labels:
    app.kubernetes.io/name: openbao-master
    darueira.io/tier: enterprise-shared
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openbao-master
  ports:
    - port: 8200
      targetPort: 8200
      name: http
