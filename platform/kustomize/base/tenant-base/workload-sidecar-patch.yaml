apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-sidecar-patch
spec:
  template:
    spec:
      containers:
        # Envoy PEP Sidecar
        - name: envoy-pep
          image: envoyproxy/envoy:v1.30-latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - envoy
            - -c
            - /etc/envoy/envoy.yaml
            - --service-cluster
            - workload-pep
          ports:
            - name: envoy-ingress
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: envoy-config-vol
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # OPA PDP Sidecar
        - name: opa-pdp
          image: openpolicyagent/opa:0.65.0-envoy-rootless
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          args:
            - "run"
            - "--server"
            - "--addr=127.0.0.1:8181"
            - "--diagnostic-addr=127.0.0.1:8282"
            - "--set=plugins.envoy_ext_authz_grpc.addr=127.0.0.1:9191"
            - "--set=plugins.envoy_ext_authz_grpc.path=envoy/authz/allow"
            - "--set=decision_logs.console=true"
            - "/policies"
          ports:
            - name: opa-grpc
              containerPort: 9191
            - name: opa-http
              containerPort: 8181
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: opa-policy-vol
              mountPath: /policies
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # OpenTelemetry Agent Sidecar
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.106.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.drr-corpshared-obs.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
          ports:
            - name: otlp-local
              containerPort: 4317
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: envoy-config-vol
          configMap:
            name: envoy-sidecar-config
        - name: opa-policy-vol
          configMap:
            name: opa-policy-config
            optional: true
        - name: tmp
          emptyDir: {}
