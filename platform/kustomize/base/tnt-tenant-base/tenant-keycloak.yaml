apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-keycloak
  labels:
    app.kubernetes.io/name: tenant-keycloak
    app.kubernetes.io/component: identity-provider
    darueira.io/tier: tenant-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-keycloak
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.1
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --http-enabled=true
            - --http-port=8080
            - --health-enabled=true
            - --metrics-enabled=true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: tenant-keycloak-credentials
                  key: admin-username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-keycloak-credentials
                  key: admin-password
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "tenant-postgres"
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: database
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: password
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-keycloak
  labels:
    app.kubernetes.io/name: tenant-keycloak
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-keycloak
  ports:
    - port: 8080
      targetPort: 8080
      name: http
