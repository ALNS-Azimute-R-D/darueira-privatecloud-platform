apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-keycloak
  namespace: drr-tnt-base-template
  labels:
    app.kubernetes.io/name: tenant-keycloak
    app.kubernetes.io/component: identity-provider
    darueira.io/tier: tenant-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-keycloak
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.1
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --http-port=8080
            - --http-management-port=9000
            - --health-enabled=true
            - --metrics-enabled=true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: KEYCLOAK_ADMIN
              value: "drr_tenant_admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "tenant_keycloak_pass_2026"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 25
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-keycloak
  namespace: drr-tnt-base-template
  labels:
    app.kubernetes.io/name: tenant-keycloak
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-keycloak
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9000
      targetPort: 9000
      name: management
