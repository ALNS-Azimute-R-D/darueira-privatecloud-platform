apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenant-minio-pvc
  labels:
    app.kubernetes.io/name: tenant-minio
    app.kubernetes.io/component: object-storage
    darueira.io/tier: tenant-workload
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-minio
  labels:
    app.kubernetes.io/name: tenant-minio
    app.kubernetes.io/component: object-storage
    darueira.io/tier: tenant-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-minio
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-08-03T04-33-23Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - minio server /data --console-address :9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tenant-minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-minio-credentials
                  key: root-password
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: bucket-provisioner
          image: minio/mc:RELEASE.2024-05-09T17-04-24Z
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: "/tmp/.mc"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tenant-minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-minio-credentials
                  key: root-password
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Tenant MinIO server..."
              until /usr/bin/mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 2
              done
              echo "Tenant MinIO ready. Ensuring standard tenant buckets exist..."
              /usr/bin/mc mb -p local/drr-tnt-acme-bizapps-documents || true
              /usr/bin/mc mb -p local/drr-tnt-acme-media || true
              /usr/bin/mc mb -p local/drr-tnt-acme-exports || true
              /usr/bin/mc mb -p local/drr-tnt-acme-backups || true
              echo "Tenant buckets successfully verified!"
              tail -f /dev/null
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: tenant-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-minio
  labels:
    app.kubernetes.io/name: tenant-minio
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-minio
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
