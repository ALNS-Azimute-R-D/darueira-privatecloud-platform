apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tenant-postgres
  labels:
    app.kubernetes.io/name: tenant-postgres
    app.kubernetes.io/component: relational-database
    darueira.io/tier: tenant-workload
spec:
  serviceName: tenant-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-postgres
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pg-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_tnt_svcs_admin -d drr_tnt_keycloak_db
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_tnt_svcs_admin -d drr_tnt_keycloak_db
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pg-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-postgres
  labels:
    app.kubernetes.io/name: tenant-postgres
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
