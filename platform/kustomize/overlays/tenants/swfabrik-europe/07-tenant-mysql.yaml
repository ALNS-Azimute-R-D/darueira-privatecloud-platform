apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenant-mysql-pvc
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-mysql
    darueira.io/tier: tenant-workload
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tenant-mysql
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-mysql
    app.kubernetes.io/component: relational-database
    darueira.io/tier: tenant-workload
spec:
  serviceName: tenant-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-mysql
        darueira.io/tier: tenant-workload
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: nbalns-mifcom-lnx-01
      containers:
        - name: mysql
          image: mysql:8.0.38
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MYSQL_DATABASE
              value: caseforce
            - name: MYSQL_USER
              value: caseforce_user
            - name: MYSQL_PASSWORD
              value: caseforce_secure_pass_2026
            - name: MYSQL_ROOT_PASSWORD
              value: mysql_root_secure_pass_2026
          ports:
            - containerPort: 3306
              name: mysql
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mysqladmin ping -uroot -pmysql_root_secure_pass_2026 --socket=/var/run/mysqld/mysqld.sock"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mysqladmin ping -uroot -pmysql_root_secure_pass_2026 --socket=/var/run/mysqld/mysqld.sock"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mysqladmin ping -uroot -pmysql_root_secure_pass_2026 --socket=/var/run/mysqld/mysqld.sock"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: tenant-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-mysql
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-mysql
    app.kubernetes.io/component: relational-database
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
