apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenant-postgres-pvc
  namespace: drr-tnt-swfabrik-latam-dev
  labels:
    app.kubernetes.io/name: tenant-postgres
    darueira.io/tier: tenant-workload
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: darueira-host-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tenant-postgres
  namespace: drr-tnt-swfabrik-latam-dev
  labels:
    app.kubernetes.io/name: tenant-postgres
    app.kubernetes.io/component: relational-database
    darueira.io/tier: tenant-workload
spec:
  serviceName: tenant-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-postgres
        darueira.io/tier: tenant-workload
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: nbalns-mifcom-lnx-01
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: POSTGRES_DB
              value: drr_tnt_bizapps_db
            - name: POSTGRES_USER
              value: drr_tnt_svcs_admin
            - name: POSTGRES_PASSWORD
              value: tenant_pg_secure_pass_2026
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pg-storage
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_tnt_svcs_admin -d drr_tnt_bizapps_db
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            # Raised from 180 (30 min): on this host's mechanical disk, the mandatory
            # "syncing data directory (fsync)" startup pass can exceed 30 min (see central-postgres
            # and docs/runbooks/host-disk-io-contention.md) and was SIGKILLing the pod mid-fsync.
            # 720 gives up to 2h grace window before giving up.
            failureThreshold: 720
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_tnt_svcs_admin -d drr_tnt_bizapps_db
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U drr_tnt_svcs_admin -d drr_tnt_bizapps_db
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: pg-storage
          persistentVolumeClaim:
            claimName: tenant-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-postgres
  namespace: drr-tnt-swfabrik-latam-dev
  labels:
    app.kubernetes.io/name: tenant-postgres
    app.kubernetes.io/component: relational-database
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
