# Repositories of tenant swfabrik-europe: Forgejo (source of truth) and their GitHub copies.
#   mirror: true   -> Forgejo push-mirrors every commit to the private GitHub repo `github`
#                     (scripts/sync_tenant_repos_github.py mirrors).
#   mirror: false  -> the code lives in its own GitHub repo (scout23DF) and is only restored from there.
#   hook: true     -> push webhook to the Tekton EventListener (starts CI/CD).
# After a disaster: scripts/sync_tenant_repos_github.py restore  (GitHub -> Forgejo), then `mirrors`.
forgejo_org: swfabrik-europe
repos:
- name: food-market-01-service
  github: ALNS-Azimute-R-D/swfabrik-europe-food-market-01-service
  mirror: true
  hook: true
