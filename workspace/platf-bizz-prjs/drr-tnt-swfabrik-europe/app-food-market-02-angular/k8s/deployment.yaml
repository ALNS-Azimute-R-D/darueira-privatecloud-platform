apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-food-market-02-angular
  namespace: drr-tnt-swfabrik-europe-marketplaces-dev
  labels:
    app.kubernetes.io/name: app-food-market-02-angular
    app.kubernetes.io/part-of: swfabrik-europe-marketplaces
    darueira.io/tier: tenant-workload
    darueira.io/tenant: swfabrik-europe
    darueira.io/project: marketplaces
    darueira.io/env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-food-market-02-angular
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-food-market-02-angular
        app.kubernetes.io/part-of: swfabrik-europe-marketplaces
        darueira.io/tier: tenant-workload
        darueira.io/tenant: swfabrik-europe
        darueira.io/project: marketplaces
        darueira.io/env: dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: localhost:8082/swfabrik-europe/app-food-market-02-angular:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-food-market-02-angular
  namespace: drr-tnt-swfabrik-europe-marketplaces-dev
  labels:
    app.kubernetes.io/name: app-food-market-02-angular
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app-food-market-02-angular
  ports:
    - port: 80
      targetPort: 8080
      name: http
