apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-market-02-service
  namespace: drr-tnt-swfabrik-europe-marketplaces-dev
  labels:
    app.kubernetes.io/name: food-market-02-service
    app.kubernetes.io/part-of: swfabrik-europe-marketplaces
    darueira.io/tier: tenant-workload
    darueira.io/tenant: swfabrik-europe
    darueira.io/project: marketplaces
    darueira.io/env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: food-market-02-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: food-market-02-service
        app.kubernetes.io/part-of: swfabrik-europe-marketplaces
        darueira.io/tier: tenant-workload
        darueira.io/tenant: swfabrik-europe
        darueira.io/project: marketplaces
        darueira.io/env: dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: localhost:8082/swfabrik-europe/food-market-02-service:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8082"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://central-postgres.drr-corpshared-plat.svc.cluster.local:5432/drr_tnt_bizapps_db?currentSchema=schm02"
            - name: QUARKUS_DATASOURCE_USERNAME
              value: "drr_admin"
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: "change-me-in-openbao"
            - name: RABBITMQ_HOST
              value: "message-broker-rabbitmq.drr-corpshared-plat.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              value: "drr_admin"
            - name: RABBITMQ_PASSWORD
              value: "darueira-admin123"
            - name: RABBITMQ_VHOST
              value: "/"
            - name: APP_MARKET_ID
              value: "MKT-EU-02-QUARKUS"
            - name: APP_RABBITMQ_TOPIC
              value: "marketplace.foodtrading.topic"
            - name: APP_RABBITMQ_QUEUE
              value: "marketplace.foodtrading.queue01"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: food-market-02-service
  namespace: drr-tnt-swfabrik-europe-marketplaces-dev
  labels:
    app.kubernetes.io/name: food-market-02-service
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: food-market-02-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
