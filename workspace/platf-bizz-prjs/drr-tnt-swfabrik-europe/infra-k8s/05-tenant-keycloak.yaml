apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-keycloak
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-keycloak
    app.kubernetes.io/component: identity-provider
    darueira.io/tier: tenant-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-keycloak
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--http-port=8080", "--proxy-headers=xforwarded"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: tenant-keycloak-credentials
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-keycloak-credentials
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://tenant-postgres:5432/drr_tnt_keycloak_db"
            - name: KC_DB_USERNAME
              value: "drr_tnt_svcs_admin"
            - name: KC_DB_PASSWORD
              value: "tenant_pg_secure_pass_2026"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 50
            periodSeconds: 15
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-keycloak
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: tenant-keycloak
    darueira.io/tier: tenant-workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-keycloak
  ports:
    - port: 8080
      targetPort: 8080
      name: http
